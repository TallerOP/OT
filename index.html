<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Avisos OP Mobility Pedrola</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
}

.topbar{
  background:#2d89ef;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

.container{
  max-width:1000px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
}

input, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  box-sizing:border-box;
}

button{
  background:#2d89ef;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1b5fa7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

.hidden{ display:none; }

.smallbtn{
  width:auto;
  padding:5px 10px;
  margin-right:5px;
}

.red{ background:#d9534f; }
.green{ background:#5cb85c; }

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox" class="container">
  <h2>Inicio de sesión</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">

<div class="topbar">
  <div id="welcome"></div>
  <button onclick="logout()">Salir</button>
</div>

<!-- ================= CREAR AVISO ================= -->
<div class="container">
<h3>Crear Aviso</h3>

<div class="grid">
  <input id="maquina" placeholder="Máquina">
  <input id="proyecto" placeholder="Proyecto">
</div>

<input id="tipo" placeholder="Tipo avería">
<input id="desc" placeholder="Descripción">

<button onclick="crearAviso()">Generar Aviso</button>
</div>

<!-- ================= CREAR OT ================= -->
<div class="container" id="otBox">
<h3>Crear OT</h3>

<div class="grid">
  <input id="emisor" placeholder="Emisor OT">
  <input id="maquinaOT" placeholder="Máquina">
</div>

<div class="grid">
  <input id="op1" placeholder="Operario 1">
  <input id="t1" placeholder="Tiempo 1">
</div>

<input id="proyectoOT" placeholder="Proyecto">
<input id="descOT" placeholder="Descripción">

<button onclick="crearOT()">Crear OT</button>
</div>

<!-- ================= AVISOS ================= -->
<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

<!-- ================= OTS ================= -->
<div class="container">
<h3>OTs pendientes exportación</h3>
<div id="ots"></div>
</div>

</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbw7tFxSsf0KzYBkMMbR--G_ijNMGH3in4KMrGitYASRBUAlSFCfMKh8kZZRhRPB7sff/exec";

let currentUser = null;
let role = null;

# =====================================================
# LOGIN
# =====================================================
function login(){

  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  fetch(`${BASE_URL}?action=login&user=${u}&pass=${p}`)
    .then(r => r.text())
    .then(t => {

      console.log("LOGIN:", t);

      const parts = t.split("|");

      if(parts[0] === "OK"){

        currentUser = u;
        role = parts[2] || "NORMAL";

        localStorage.setItem("user", u);
        localStorage.setItem("role", role);

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

        document.getElementById("welcome").innerText =
          "Usuario: " + u + " | Rol: " + role;

        loadData();

      } else {
        alert("Login incorrecto");
      }

    });

}

# =====================================================
# LOGOUT
# =====================================================
function logout(){
  localStorage.clear();
  location.reload();
}

# =====================================================
# AUTOLOGIN
# =====================================================
window.onload = function(){

  const u = localStorage.getItem("user");
  const r = localStorage.getItem("role");

  if(u){
    currentUser = u;
    role = r;

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("welcome").innerText =
      "Usuario: " + u + " | Rol: " + r;

    loadData();
  }

};

# =====================================================
# CREAR AVISO
# =====================================================
function crearAviso(){

  const data = new URLSearchParams();

  data.append("action","crearAviso");
  data.append("usuario",currentUser);
  data.append("maquina",document.getElementById("maquina").value);
  data.append("proyecto",document.getElementById("proyecto").value);
  data.append("tipo",document.getElementById("tipo").value);
  data.append("descripcion",document.getElementById("desc").value);

  fetch(BASE_URL,{ method:"POST", body:data })
    .then(()=>loadData());

}

# =====================================================
# CREAR OT
# =====================================================
function crearOT(){

  const data = new URLSearchParams();

  data.append("action","crearOT");
  data.append("emisor",document.getElementById("emisor").value);
  data.append("maquina",document.getElementById("maquinaOT").value);
  data.append("op1",document.getElementById("op1").value);
  data.append("t1",document.getElementById("t1").value);
  data.append("proyecto",document.getElementById("proyectoOT").value);
  data.append("descripcion",document.getElementById("descOT").value);

  fetch(BASE_URL,{ method:"POST", body:data })
    .then(()=>loadData());

}

# =====================================================
# CARGA GENERAL
# =====================================================
function loadData(){
  loadAvisos();
  loadOTs();
}

# =====================================================
# AVISOS
# =====================================================
function loadAvisos(){

  fetch(BASE_URL+"?action=getAvisos")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("avisos");
    div.innerHTML = "";

    const rows = t.split("\n");

    rows.forEach((r,i)=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        <b>${f[3]}</b> - ${f[5]}

        <br><br>

        ${role !== "Produccion" ? `
        <button class="smallbtn green" onclick="convertirAviso(${i+2})">Convertir OT</button>
        ` : ""}

        <button class="smallbtn red" onclick="eliminarAviso(${i+2})">Eliminar</button>
      </div>`;
    });

  });

}

# =====================================================
# OTs
# =====================================================
function loadOTs(){

  fetch(BASE_URL+"?action=getOTs")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("ots");
    div.innerHTML = "";

    const rows = t.split("\n");

    rows.forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        OT: ${f[0]} | ${f[4]} | ${f[11]}
      </div>`;
    });

  });

}

# =====================================================
# CONVERTIR AVISO
# =====================================================
function convertirAviso(row){

  fetch(BASE_URL+"?action=convertirAviso&row="+row+"&usuario="+currentUser)
  .then(()=>loadData());

}

# =====================================================
# ELIMINAR AVISO
# =====================================================
function eliminarAviso(row){

  fetch(BASE_URL+"?action=rechazarAviso&row="+row+"&usuario="+currentUser)
  .then(()=>loadData());

}

</script>

</body>
</html>
