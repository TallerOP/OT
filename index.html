<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Avisos OP Mobility Pedrola</title>

<style>
body{ margin:0;font-family:Arial;background:#f4f4f4; }

.header{
  background:#2d89ef;
  color:white;
  padding:12px;
  font-size:18px;
}

.container{
  max-width:1000px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
}

input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  box-sizing:border-box;
}

button{
  background:#2d89ef;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{ background:#1b5fa7; }

.card{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

.smallbtn{
  width:auto;
  padding:5px 10px;
  margin-right:5px;
}

.green{ background:#5cb85c; }
.red{ background:#d9534f; }

.hidden{ display:none; }

/* DEBUG */
#debugBox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-height:180px;
  overflow:auto;
  background:#000;
  color:#00ff00;
  font-size:12px;
  padding:8px;
  display:none;
  z-index:99999;
}
</style>
</head>

<body>

<div id="debugBox"></div>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="header">Bienvenido al sistema de gestión de avisos</div>

  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="header">
  Gestión de Avisos OP Mobility Pedrola
  <button onclick="logout()" style="float:right;width:auto;">Cerrar sesión</button>
</div>

<div class="container">

<h3>Generar Aviso / OT</h3>

<select id="maquina"></select>
<select id="proyecto"></select>
<select id="tipo"></select>

<input id="desc" placeholder="Descripción">

<button onclick="crearAviso()">Generar Aviso</button>

<button id="btnOT" onclick="crearOT()">Generar OT</button>

</div>

<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

<div class="container" id="otPanel">
<h3>OTs pendientes exportación</h3>
<div id="ots"></div>
</div>

</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbxtvL5y0-8JQ7hiueBguwMth3hHS5olZtNEsMOhAN4Aj9tCxM-mJpM9PkpwM7tVSAzn/exec";

let currentUser = null;
let role = null;

// ================= DEBUG =================
function logDebug(m){
  const b = document.getElementById("debugBox");
  b.style.display = "block";
  b.innerHTML += "<div>> "+m+"</div>";
}

// ================= LOGIN =================
function login(){

  fetch(BASE_URL+"?action=login&user="+user.value+"&pass="+pass.value)
  .then(r=>r.text())
  .then(t=>{

    logDebug("LOGIN: "+t);

    const p = t.split("|");

    if(p[0]==="OK"){

      currentUser = user.value;
      role = p[2] || "NORMAL";

      loginBox.classList.add("hidden");
      app.classList.remove("hidden");

      applyRoles();
      loadData();
      loadLists();

    } else {
      alert("Login incorrecto");
    }

  });

}

// ================= LOGOUT =================
function logout(){
  localStorage.clear();
  location.reload();
}

// ================= ROLES =================
function applyRoles(){

  logDebug("ROL: "+role);

  if(role === "Produccion"){
    btnOT.style.display = "none";
    otPanel.style.display = "none";
  } else {
    btnOT.style.display = "block";
    otPanel.style.display = "block";
  }

}

// ================= LISTAS =================
function loadLists(){

  logDebug("Cargando listas...");

  fetch(BASE_URL+"?action=getListas")
  .then(r=>r.text())
  .then(t=>{

    logDebug("RAW LISTAS: "+t);

    maquina.innerHTML = "";
    proyecto.innerHTML = "";
    tipo.innerHTML = "";

    const lines = t.trim().split("\n");

    if(!t || lines.length===0){
      logDebug("LISTAS VACÍAS O ERROR");
      return;
    }

    lines.forEach(l=>{

      const f = l.split("|");

      if(f.length<2) return;

      if(f[0]==="MAQUINA") maquina.innerHTML += `<option>${f[1]}</option>`;
      if(f[0]==="PROYECTO") proyecto.innerHTML += `<option>${f[1]}</option>`;
      if(f[0]==="AVERIA") tipo.innerHTML += `<option>${f[1]}</option>`;

    });

  })
  .catch(e=>{
    logDebug("ERROR LISTAS: "+e.message);
  });

}

// ================= LOAD =================
function loadData(){
  loadAvisos();
  loadOTs();
}

// ================= AVISOS =================
function loadAvisos(){

  fetch(BASE_URL+"?action=getAvisos")
  .then(r=>r.text())
  .then(t=>{

    const d = avisos;
    d.innerHTML = "";

    t.split("\n").forEach((r,i)=>{

      if(!r) return;

      const f = r.split("|");

      d.innerHTML += `
      <div class="card">
        <b>${f[3]}</b> - ${f[5]}<br>
        Usuario: ${f[2]} | Fecha: ${f[1]}<br>

        ${role!=="Produccion" ? `
        <button class="smallbtn green" onclick="convertirAviso(${i+2})">Convertir OT</button>
        `:""}

        <button class="smallbtn red" onclick="eliminarAviso(${i+2})">Eliminar</button>
      </div>`;
    });

  });

}

// ================= OTs =================
function loadOTs(){

  fetch(BASE_URL+"?action=getOTs")
  .then(r=>r.text())
  .then(t=>{

    ots.innerHTML = "";

    t.split("\n").forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      ots.innerHTML += `
      <div class="card">
        OT: ${f[0]} | ${f[4]} | ${f[11]}
      </div>`;
    });

  });

}

// ================= ACTIONS =================
function convertirAviso(r){
  fetch(BASE_URL+"?action=convertirAviso&row="+r+"&usuario="+currentUser)
  .then(()=>loadData());
}

function eliminarAviso(r){
  fetch(BASE_URL+"?action=rechazarAviso&row="+r+"&usuario="+currentUser)
  .then(()=>loadData());
}

</script>

</body>
</html>
