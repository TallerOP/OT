<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Avisos OP Mobility Pedrola</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:url('op.png') no-repeat center center fixed;
  background-size:cover;
}

.overlay{
  background:rgba(255,255,255,0.92);
  min-height:100vh;
}

/* HEADER */
.header{
  background:#003366;
  color:white;
  padding:10px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu{
  display:flex;
  gap:10px;
}

.menu button{
  background:white;
  color:#003366;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.logout{
  background:white;
  color:#003366;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* CONTENEDOR */
.container{
  max-width:900px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* INPUTS */
input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

/* BOTONES */
.btn{
  background:#003366;
  color:white;
  border:none;
  cursor:pointer;
}

.btn:hover{
  background:#0055aa;
}

.btn-danger{
  background:#dc3545;
  color:white;
  border:none;
  cursor:pointer;
}

.btn-ok{
  background:#28a745;
  color:white;
  border:none;
  cursor:pointer;
}

/* CARD */
.card{
  border:1px solid #ddd;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  background:#fafafa;
}

.desc{
  font-weight:bold;
  font-size:15px;
  margin:6px 0;
}

/* DEBUG */
#debugBox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-height:180px;
  overflow:auto;
  background:black;
  color:#00ff00;
  font-size:12px;
  padding:8px;
  display:none;
}
</style>
</head>

<body>

<div class="overlay">

<div id="debugBox"></div>

<!-- LOGIN -->
<div id="loginBox" class="container">
<h2>Bienvenido al sistema de gestión de avisos</h2>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="header">

<div class="menu">
<button onclick="irPendientes()">Avisos convertidos</button>
<button id="btnDashboard" onclick="irDashboard()">Dashboard</button>
</div>

<button class="logout" onclick="logout()">Cerrar sesión</button>

</div>

<div class="container">

<h3>Generar Aviso / OT</h3>

<select id="maquina"></select>
<select id="proyecto"></select>
<select id="tipo"></select>

<input id="desc" placeholder="Descripción">

<button id="btnAviso" class="btn" onclick="crearAviso()">Generar Aviso</button>
<button id="btnOT" class="btn" onclick="crearOT()">Generar OT</button>

</div>

<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

</div>
</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbzV4pdlfcXUf6gyAv51ZSGZkSoe9qeeL8kOD_vV2QbyY_HTDm9tz99l9PiHMZb7FnTu/exec";

let currentUser=null;
let role=null;

/* DEBUG */
function logDebug(m){
const d=document.getElementById("debugBox");
d.style.display="block";
d.innerHTML+="<div>> "+m+"</div>";
}

/* LOGIN */
function login(){

fetch(`${BASE_URL}?action=login&user=${user.value}&pass=${pass.value}`)
.then(r=>r.text())
.then(t=>{

logDebug("LOGIN: "+t);

const p=t.split("|");

if(p[0]==="OK"){
currentUser=user.value;
role=p[2];

loginBox.style.display="none";
app.style.display="block";

applyRoles();
loadLists();
loadAvisos();
}else{
alert("Login incorrecto");
}

});
}

/* ROLES */
function applyRoles(){

if(role==="Produccion"){
btnOT.style.display="none";
btnDashboard.style.display="none";
}

}

/* LISTAS */
function loadLists(){

fetch(BASE_URL+"?action=getListas")
.then(r=>r.text())
.then(t=>{

maquina.innerHTML="";
proyecto.innerHTML="";
tipo.innerHTML="";

t.split("\n").forEach(l=>{
if(!l)return;
const f=l.split("|");

if(f[0]==="MAQUINA") maquina.innerHTML+=`<option>${f[1]}</option>`;
if(f[0]==="PROYECTO") proyecto.innerHTML+=`<option>${f[1]}</option>`;
if(f[0]==="AVERIA") tipo.innerHTML+=`<option>${f[1]}</option>`;
});

});
}

/* CREAR AVISO */
function crearAviso(){

fetch(BASE_URL,{
method:"POST",
body:new URLSearchParams({
action:"crearAviso",
usuario:currentUser,
maquina:maquina.value,
proyecto:proyecto.value,
tipo:tipo.value,
descripcion:desc.value
})
})
.then(r=>r.text())
.then(t=>{
logDebug("AVISO: "+t);
alert("Aviso registrado");
loadAvisos();
});
}

/* CREAR OT */
function crearOT(){

localStorage.setItem("ot_maquina",maquina.value);
localStorage.setItem("ot_proyecto",proyecto.value);
localStorage.setItem("ot_desc",desc.value);

window.location.href="ot.html";
}

/* AVISOS */
function loadAvisos(){

fetch(BASE_URL+"?action=getAvisos")
.then(r=>r.text())
.then(t=>{

avisos.innerHTML="";

t.split("\n").forEach((r,i)=>{

if(!r)return;

const f=r.split("|");
const row=f[0]; // 👈 FIX REAL (fila correcta)

avisos.innerHTML+=`
<div class="card">

<div><b>Máquina:</b> ${f[3]}</div>
<div><b>Fecha:</b> ${new Date(f[1]).toLocaleString()}</div>
<div class="desc">${f[6]}</div>
<div><b>Usuario:</b> ${f[2]}</div>

<button class="btn-ok"
onclick="convertirAviso(this)"
data-row="${row}"
data-data="${encodeURIComponent(f.join('||'))}">
Convertir a OT
</button>

<button class="btn-danger"
onclick="eliminarAviso(this)"
data-row="${row}">
Eliminar
</button>

</div>`;
});

});
}

/* CONVERTIR */
window.convertirAviso = function(el){

const row = el.getAttribute("data-row");
const data = decodeURIComponent(el.getAttribute("data-data"));

logDebug("CONVERTIR: "+row);

fetch(BASE_URL+"?action=convertirAviso&row="+row+"&usuario="+currentUser)
.then(r=>r.text())
.then(t=>{

logDebug("RESP: "+t);

localStorage.setItem("aviso_data",data);
window.location.href="ot.html";

});

}

/* ELIMINAR */
window.eliminarAviso = function(el){

const row = el.getAttribute("data-row");

logDebug("ELIMINAR: "+row);

fetch(BASE_URL+"?action=rechazarAviso&row="+row+"&usuario="+currentUser)
.then(r=>r.text())
.then(t=>{
logDebug("RESP: "+t);
loadAvisos();
});

}

/* NAV */
function irPendientes(){
window.location.href="pendientes.html";
}

function irDashboard(){
window.location.href="dashboard.html";
}

function logout(){
location.reload();
}

</script>

</body>
</html>
