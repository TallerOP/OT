<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de avisos OP Mobility Pedrola</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
}

.topbar{
  background:#2d89ef;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

.container{
  max-width:1000px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
}

input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  box-sizing:border-box;
}

button{
  background:#2d89ef;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1b5fa7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

.hidden{ display:none; }

.smallbtn{
  width:auto;
  padding:5px 10px;
  margin-right:5px;
}

.red{ background:#d9534f; }
.green{ background:#5cb85c; }

#debugBox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-height:180px;
  overflow:auto;
  background:#000;
  color:#00ff00;
  font-size:12px;
  padding:8px;
  display:none;
  z-index:99999;
}
</style>
</head>

<body>

<!-- DEBUG -->
<div id="debugBox"></div>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <h2>Bienvenido al servicio de gestión de avisos</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="topbar">
  <div id="welcome"></div>
  <button onclick="logout()">Salir</button>
</div>

<!-- ================= FORM UNIFICADO ================= -->
<div class="container">
<h3>Generar Aviso / OT</h3>

<div class="grid">
  <select id="maquina"></select>
  <select id="proyecto"></select>
</div>

<select id="tipo"></select>

<input id="desc" placeholder="Descripción">

<div class="grid">
  <input id="emisor" placeholder="Emisor OT">
</div>

<div class="grid">
  <input id="op1" placeholder="Operario 1">
  <input id="t1" placeholder="Tiempo 1">
</div>

<button onclick="crearAviso()">Generar Aviso</button>

<button id="btnOT" onclick="crearOT()">Generar OT</button>

</div>

<!-- ================= AVISOS ================= -->
<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

<!-- ================= OTs ================= -->
<div id="otPanel" class="container">
<h3>OTs pendientes exportación</h3>
<div id="ots"></div>
</div>

</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbzc4rVg7WTutyAM4BzSQXhur-jv7NhEW84_AfLL_b-rlTP97TgKLSGjZAQmeDDct-Zq/exec";

let currentUser = null;
let role = null;

// ================= DEBUG =================
function logDebug(msg){
  const box = document.getElementById("debugBox");
  box.style.display = "block";
  box.innerHTML += "<div>> " + msg + "</div>";
}

// ================= LOGIN =================
function login(){

  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  fetch(`${BASE_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`)
    .then(r=>r.text())
    .then(t=>{

      const parts = t.split("|");

      if(parts[0] === "OK"){

        currentUser = u;
        role = parts[2] || "NORMAL";

        localStorage.setItem("user", u);
        localStorage.setItem("role", role);

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

        document.getElementById("welcome").innerText =
          "Usuario: " + u + " | Rol: " + role;

        applyRoleRules();
        loadData();
        loadLists();

      } else {
        alert("Login incorrecto");
      }

    });

}

// ================= LOGOUT =================
function logout(){
  localStorage.clear();
  location.reload();
}

// ================= ROLES =================
function applyRoleRules(){

  if(role === "Produccion"){
    document.getElementById("btnOT").style.display = "none";
    document.getElementById("otPanel").style.display = "none";
  }

}

// ================= LISTAS DROPDOWN =================
function loadLists(){

  fetch(BASE_URL+"?action=getListas")
  .then(r=>r.text())
  .then(t=>{

    const rows = t.split("\n");

    let maq = document.getElementById("maquina");
    let pro = document.getElementById("proyecto");
    let tip = document.getElementById("tipo");

    maq.innerHTML = "";
    pro.innerHTML = "";
    tip.innerHTML = "";

    rows.forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      if(f[0] === "MAQUINA"){
        maq.innerHTML += `<option>${f[1]}</option>`;
      }

      if(f[0] === "PROYECTO"){
        pro.innerHTML += `<option>${f[1]}</option>`;
      }

      if(f[0] === "AVERIA"){
        tip.innerHTML += `<option>${f[1]}</option>`;
      }

    });

  });

}

// ================= AVISO =================
function crearAviso(){

  const data = new URLSearchParams();

  data.append("action","crearAviso");
  data.append("usuario",currentUser);
  data.append("maquina",maquina.value);
  data.append("proyecto",proyecto.value);
  data.append("tipo",tipo.value);
  data.append("descripcion",desc.value);

  fetch(BASE_URL,{ method:"POST", body:data })
    .then(()=>loadData());

}

// ================= OT =================
function crearOT(){

  const data = new URLSearchParams();

  data.append("action","crearOT");
  data.append("emisor",emisor.value);
  data.append("maquina",maquina.value);
  data.append("op1",op1.value);
  data.append("t1",t1.value);
  data.append("proyecto",proyecto.value);
  data.append("descripcion",desc.value);

  fetch(BASE_URL,{ method:"POST", body:data })
    .then(()=>loadData());

}

// ================= LOAD =================
function loadData(){
  loadAvisos();
  loadOTs();
}

// ================= AVISOS =================
function loadAvisos(){

  fetch(BASE_URL+"?action=getAvisos")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("avisos");
    div.innerHTML = "";

    const rows = t.split("\n");

    rows.forEach((r,i)=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        <b>${f[3]}</b> - ${f[5]}
        <br>
        Usuario: ${f[2]} | Fecha: ${f[1]}
        <br><br>

        ${role !== "Produccion" ? `
        <button class="smallbtn green" onclick="convertirAviso(${i+2})">Convertir OT</button>
        ` : ""}

        <button class="smallbtn red" onclick="eliminarAviso(${i+2})">Eliminar</button>
      </div>`;
    });

  });

}

// ================= OTs =================
function loadOTs(){

  fetch(BASE_URL+"?action=getOTs")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("ots");
    div.innerHTML = "";

    const rows = t.split("\n");

    rows.forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        OT: ${f[0]} | ${f[4]} | ${f[11]}
      </div>`;
    });

  });

}

// ================= ACTIONS =================
function convertirAviso(row){
  fetch(BASE_URL+"?action=convertirAviso&row="+row+"&usuario="+currentUser)
  .then(()=>loadData());
}

function eliminarAviso(row){
  fetch(BASE_URL+"?action=rechazarAviso&row="+row+"&usuario="+currentUser)
  .then(()=>loadData());
}

</script>

</body>
</html>
