<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión</title>

<style>

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.5); /* 🔥 50% transparencia */
min-height:100vh;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.75);
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{min-height:100px;}

button{cursor:pointer;font-weight:bold;}

.btn-red{background:red;color:white;}
.btn-orange{background:orange;color:black;}
.btn-yellow{background:gold;color:black;}

.aviso{
background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<div id="loginBox" class="card">

<h2>Login</h2>
<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>

</div>

<div id="mainBox" class="hidden">

<div class="card">
<button class="btn-red" onclick="logout()">Cerrar sesión</button>
</div>

<div class="card">

<h3>Nuevo Aviso</h3>

<select id="maquina"></select>
<select id="tipoAveria"></select>

<!-- 🔥 PROYECTO ahora desplegable -->
<select id="proyecto"></select>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<button class="btn-yellow" onclick="crearAviso()">Crear Aviso</button>

</div>

<div id="otDirecta" class="card hidden">

<button class="btn-orange" onclick="crearOTDirecta()">Crear OT</button>

</div>

<div id="avisosBox" class="card hidden">

<h3>Avisos pendientes</h3>
<div id="listaAvisos"></div>

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USER=null;
let LISTAS={};
let EMISORES=[];

async function login(){

const u=usuario.value;
const p=password.value;

const r=await fetch(`${API}?action=login&usuario=${u}&password=${p}`);
const d=await r.json();

if(!d.ok)return alert("Login incorrecto");

USER=d;
localStorage.setItem("u",JSON.stringify(d));

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("mainBox").classList.remove("hidden");

loadListas();
loadEmisores();

if(USER.rol!="Operario"){
document.getElementById("otDirecta").classList.remove("hidden");
document.getElementById("avisosBox").classList.remove("hidden");
loadAvisos();
}

}

async function loadListas(){

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas;

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO"); // 🔥 NUEVO

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

async function loadEmisores(){

const r=await fetch(`${API}?action=getUsuarios`);
const d=await r.json();

EMISORES=d.usuarios.map(u=>u.emisor);

}

function crearAviso(){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearAviso",
usuario:USER.usuario,
maquina:maquina.value,
proyecto:proyecto.value,
tipoAveria:tipoAveria.value,
descripcion:descripcion.value
})
}).then(()=>{

alert("Aviso creado");
descripcion.value="";

});

}

/* 🔥 ELIMINAR AVISO DESDE UI */
function eliminarAviso(id){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario
})
}).then(()=>{

document.getElementById(id).remove(); // 🔥 DESAPARECE INMEDIATAMENTE

});

}

async function loadAvisos(){

const r=await fetch(`${API}?action=getAvisos`);
const d=await r.json();

listaAvisos.innerHTML="";

d.avisos.forEach(a=>{

let div=document.createElement("div");
div.className="aviso";
div.id=a.avisoID;

div.innerHTML=`
<b>${a.maquina}</b><br>
${a.tipoAveria}<br>
${a.descripcion}<br><br>

<button class="btn-orange" onclick="convertir('${a.avisoID}')">Convertir OT</button>
<button class="btn-red" onclick="eliminarAviso('${a.avisoID}')">Eliminar</button>
`;

listaAvisos.appendChild(div);

});

}

function convertir(id){

location.href=`ot.html?aviso=${id}`;

}

function crearOTDirecta(){
location.href="ot.html";
}

function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
