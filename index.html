<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Avisos</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.78);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{display:block;margin-top:10px;font-weight:bold;}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{min-height:100px;}

.btn-red{background:#d32f2f;color:white;}
.btn-orange{background:#f57c00;color:black;}
.btn-yellow{background:#fbc02d;color:black;}
.btn-blue{background:#1976d2;color:white;}

.aviso{
background:#222;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div id="loginBox" class="card">
<h2>Login</h2>
<input id="usuario">
<input id="password" type="password">
<button onclick="login()">Entrar</button>
</div>

<div id="mainBox" class="hidden">

<div class="card">
<button class="btn-red" onclick="logout()">Cerrar sesión</button>
</div>

<div class="card">

<h3>Nuevo Aviso</h3>

<label>Máquina</label>
<select id="maquina"></select>

<label>Avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Descripción *</label>
<textarea id="descripcion"></textarea>

<button class="btn-yellow" onclick="crearAviso()">Crear Aviso</button>

</div>

<div class="card">

<h3>Avisos pendientes</h3>
<div id="listaAvisos"></div>

</div>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USER=null;
let LISTAS={};

async function login(){

const r=await fetch(`${API}?action=login&usuario=${usuario.value}&password=${password.value}`);
const d=await r.json();

if(!d.ok)return alert(d.error);

USER=d;
localStorage.setItem("u",JSON.stringify(d));

loginBox.classList.add("hidden");
mainBox.classList.remove("hidden");

await loadListas();
loadAvisos();

}

async function loadListas(){

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas||{};

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO");

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* CREAR AVISO */
async function crearAviso(){

if(!descripcion.value.trim()){
return alert("Descripción obligatoria");
}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearAviso",
usuario:USER.usuario,
maquina:maquina.value,
tipoAveria:tipoAveria.value,
proyecto:proyecto.value,
descripcion:descripcion.value
})
});

descripcion.value="";
loadAvisos();

}

/* CARGAR AVISOS */
async function loadAvisos(){

const r=await fetch(`${API}?action=getAvisos`);
const d=await r.json();

listaAvisos.innerHTML="";

(d.avisos||[])
.filter(a=>a.estado!=="Rechazado" && a.estado!=="Convertido")
.forEach(a=>{

let div=document.createElement("div");
div.className="aviso";
div.id=a.avisoID;

let acciones=`<button class="btn-orange" onclick="convertir('${a.avisoID}')">Convertir OT</button>
<button class="btn-red" onclick="eliminar('${a.avisoID}')">Eliminar aviso</button>`;

div.innerHTML=`
<b>${a.maquina}</b><br>
${a.tipoAveria}<br>
${a.descripcion}<br><br>
${acciones}
`;

listaAvisos.appendChild(div);

});

}

/* ELIMINAR AVISO (RECHAZADO) */
async function eliminar(id){

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario,
fecha:new Date().toISOString()
})
});

document.getElementById(id)?.remove();

}

/* CONVERTIR */
function convertir(id){
location.href=`ot.html?aviso=${id}`;
}

function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
