<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Avisos OP Mobility Pedrola</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:url('op.png') no-repeat center center fixed;
  background-size:cover;
  color:#333;
}

/* CAPA BLANCA SUAVE */
.overlay{
  background:rgba(255,255,255,0.9);
  min-height:100vh;
}

/* HEADER */
.header{
  background:#003366;
  color:white;
  padding:12px;
  font-size:18px;
  display:flex;
  justify-content:space-between;
}

/* CONTENEDOR */
.container{
  max-width:900px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* INPUTS */
input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

/* BOTONES */
button{
  background:#003366;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#0055aa;
}

.green{ background:#28a745; }
.red{ background:#dc3545; }

/* TARJETAS */
.card{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  background:#fafafa;
}

/* DEBUG */
#debugBox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-height:200px;
  overflow:auto;
  background:black;
  color:#00ff00;
  font-size:12px;
  padding:8px;
  display:none;
}
</style>
</head>

<body>

<div class="overlay">

<div id="debugBox"></div>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <h2>Bienvenido al sistema de gestión de avisos</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="header">
  <div>Gestión OP Mobility</div>
  <button onclick="logout()">Cerrar sesión</button>
</div>

<div class="container">

<h3>Generar Aviso / OT</h3>

<select id="maquina"></select>
<select id="proyecto"></select>
<select id="tipo"></select>

<input id="desc" placeholder="Descripción">

<button onclick="crearAviso()">Generar Aviso</button>
<button id="btnOT" onclick="crearOT()">Generar OT</button>

</div>

<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

<div class="container" id="otPanel">
<h3>OTs pendientes</h3>
<div id="ots"></div>
</div>

</div>
</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbzV4pdlfcXUf6gyAv51ZSGZkSoe9qeeL8kOD_vV2QbyY_HTDm9tz99l9PiHMZb7FnTu/exec";

let currentUser=null;
let role=null;

// DEBUG
function logDebug(m){
  const d=document.getElementById("debugBox");
  d.style.display="block";
  d.innerHTML+="<div>> "+m+"</div>";
}

// LOGIN
function login(){

fetch(`${BASE_URL}?action=login&user=${user.value}&pass=${pass.value}`)
.then(r=>r.text())
.then(t=>{

logDebug("LOGIN: "+t);

const p=t.split("|");

if(p[0]==="OK"){
currentUser=user.value;
role=p[2];

loginBox.style.display="none";
app.style.display="block";

applyRoles();
loadLists();
loadData();
}else{
alert("Login incorrecto");
}

});
}

// LOGOUT
function logout(){ location.reload(); }

// ROLES
function applyRoles(){
if(role==="Produccion"){
btnOT.style.display="none";
otPanel.style.display="none";
}
}

// LISTAS
function loadLists(){

fetch(BASE_URL+"?action=getListas")
.then(r=>r.text())
.then(t=>{

logDebug("LISTAS: "+t);

maquina.innerHTML="";
proyecto.innerHTML="";
tipo.innerHTML="";

t.split("\n").forEach(l=>{

if(!l)return;
const f=l.split("|");

if(f[0]==="MAQUINA") maquina.innerHTML+=`<option>${f[1]}</option>`;
if(f[0]==="PROYECTO") proyecto.innerHTML+=`<option>${f[1]}</option>`;
if(f[0]==="AVERIA") tipo.innerHTML+=`<option>${f[1]}</option>`;

});

});
}

// CREAR AVISO
function crearAviso(){

fetch(BASE_URL,{
method:"POST",
body:new URLSearchParams({
action:"crearAviso",
usuario:currentUser,
maquina:maquina.value,
proyecto:proyecto.value,
tipo:tipo.value,
descripcion:desc.value
})
})
.then(r=>r.text())
.then(t=>{
logDebug("AVISO: "+t);
alert("Aviso creado");
loadData();
});
}

// CREAR OT
function crearOT(){

fetch(BASE_URL,{
method:"POST",
body:new URLSearchParams({
action:"crearOT",
maquina:maquina.value,
proyecto:proyecto.value,
descripcion:desc.value
})
})
.then(r=>r.text())
.then(t=>{

logDebug("OT: "+t);

if(t==="OK"){
window.location.href="ot.html";
}else{
alert("Error OT");
}

});
}

// AVISOS
function loadAvisos(){

fetch(BASE_URL+"?action=getAvisos")
.then(r=>r.text())
.then(t=>{

avisos.innerHTML="";

t.split("\n").forEach((r,i)=>{

if(!r)return;

const f=r.split("|");

const row=i+2;

avisos.innerHTML+=`
<div class="card">
<b>${f[3]}</b> - ${f[5]}<br>
Usuario: ${f[2]} | Fecha: ${f[1]}<br><br>

${role!=="Produccion" ? `<button class="green" onclick="convertirAviso(${row})">Convertir OT</button>`:""}

<button class="red" onclick="eliminarAviso(${row})">Eliminar</button>
</div>`;
});

});
}

// OTs
function loadOTs(){

fetch(BASE_URL+"?action=getOTs")
.then(r=>r.text())
.then(t=>{

ots.innerHTML="";

t.split("\n").forEach(r=>{
if(!r)return;
const f=r.split("|");
ots.innerHTML+=`<div class="card">OT ${f[0]}</div>`;
});

});
}

// CONVERTIR
function convertirAviso(row){

logDebug("Convertir fila "+row);

fetch(BASE_URL+`?action=convertirAviso&row=${row}&usuario=${currentUser}`)
.then(r=>r.text())
.then(t=>{
logDebug("RESP CONVERTIR: "+t);
alert("Aviso convertido");
loadData();
});
}

// ELIMINAR
function eliminarAviso(row){

logDebug("Eliminar fila "+row);

fetch(BASE_URL+`?action=rechazarAviso&row=${row}&usuario=${currentUser}`)
.then(r=>r.text())
.then(t=>{
logDebug("RESP ELIMINAR: "+t);
alert("Aviso eliminado");
loadData();
});
}

// LOAD
function loadData(){
loadAvisos();
loadOTs();
}

</script>

</body>
</html>
