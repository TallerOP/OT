<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión Avisos</title>

<style>

body{
font-family:Arial;
margin:0;
padding:0;
background:url('op.png');
background-size:cover;
background-position:center;
min-height:100vh;
color:white;
}

.container{
background:rgba(0,0,0,0.75);
margin:10px;
padding:20px;
border-radius:10px;
}

input,select,textarea,button{
width:100%;
margin-top:10px;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
box-sizing:border-box;
}

button{
background:#1976d2;
color:white;
font-weight:bold;
}

.card{
background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.hidden{
display:none;
}

</style>

</head>
<body>

<div class="container" id="loginBox">

<h2>Login</h2>

<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Entrar</button>

</div>

<div class="container hidden" id="mainBox">

<button onclick="logout()">Cerrar sesión</button>

<h2>Nuevo Aviso</h2>

<select id="maquina"></select>

<select id="tipoAveria"></select>

<input id="proyecto" placeholder="Proyecto">

<textarea id="descripcion" placeholder="Descripción"></textarea>

<button onclick="crearAviso()">Crear Aviso</button>

<div id="otDirecta" class="hidden">

<h2>Crear OT directa</h2>

<button onclick="crearOTDirecta()">Nueva OT</button>

</div>

<div id="avisosPendientes" class="hidden">

<h2>Avisos Pendientes</h2>

<div id="listaAvisos"></div>

</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USER = null;

let LISTAS = {};

async function login(){

const usuario=document.getElementById("usuario").value;
const password=document.getElementById("password").value;

const r=await fetch(`${API}?action=login&usuario=${usuario}&password=${password}`);

const d=await r.json();

if(!d.ok){
alert(d.error);
return;
}

USER=d;

localStorage.setItem("user",JSON.stringify(d));

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("mainBox").classList.remove("hidden");

await cargarListas();

if(USER.rol=="Supervisor" || USER.rol=="Técnico"){

document.getElementById("otDirecta").classList.remove("hidden");

document.getElementById("avisosPendientes").classList.remove("hidden");

cargarAvisos();

}

}

function logout(){

localStorage.clear();
location.reload();

}

async function cargarListas(){

const r=await fetch(`${API}?action=getListas`);

const d=await r.json();

LISTAS=d.listas;

cargarSelect("maquina","MAQUINA");
cargarSelect("tipoAveria","AVERIA");

}

function cargarSelect(id,tipo){

const s=document.getElementById(id);

s.innerHTML="";

LISTAS[tipo].forEach(v=>{

const o=document.createElement("option");

o.value=v;
o.textContent=v;

s.appendChild(o);

});

}

async function crearAviso(){

const body={

action:"crearAviso",
usuario:USER.usuario,
maquina:maquina.value,
proyecto:proyecto.value,
tipoAveria:tipoAveria.value,
descripcion:descripcion.value

};

const r=await fetch(API,{
method:"POST",
body:JSON.stringify(body)
});

const d=await r.json();

if(d.ok){

alert("Aviso creado");

descripcion.value="";

}

}

function crearOTDirecta(){

location.href="ot.html";

}

async function cargarAvisos(){

const r=await fetch(`${API}?action=getAvisos`);

const d=await r.json();

const cont=document.getElementById("listaAvisos");

cont.innerHTML="";

d.avisos.forEach(a=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<b>${a.maquina}</b><br>
${a.tipoAveria}<br>
${a.descripcion}<br><br>

<button onclick="convertirAviso('${a.avisoID}')">Convertir a OT</button>

<button onclick="rechazarAviso('${a.avisoID}')">Eliminar aviso</button>

`;

cont.appendChild(div);

});

}

async function convertirAviso(id){

const r=await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"convertirAviso",
avisoID:id,
emisor:USER.emisor
})
});

const d=await r.json();

if(d.ok){

location.href=`ot.html?ot=${d.ot}`;

}

}

async function rechazarAviso(id){

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario
})
});

cargarAvisos();

}

window.onload=()=>{

const u=localStorage.getItem("user");

if(u){

USER=JSON.parse(u);

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("mainBox").classList.remove("hidden");

cargarListas();

if(USER.rol=="Supervisor" || USER.rol=="Técnico"){

document.getElementById("otDirecta").classList.remove("hidden");
document.getElementById("avisosPendientes").classList.remove("hidden");

cargarAvisos();

}

}

}

</script>

</body>
</html>
