<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:10px;
}

.card{
background:rgba(0,0,0,0.8);
padding:12px;
border-radius:12px;
margin-bottom:12px;
color:white;
}

input,select,textarea,button{
width:100%;
padding:10px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:15px;
box-sizing:border-box;
}

textarea{min-height:80px;}

.btn-yellow{background:#fbc02d;}
.btn-red{background:#d32f2f;color:white;}
.btn-blue{background:#1976d2;color:white;}
.btn-orange{background:#f57c00;color:black;}

.aviso{
background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;
word-break:break-word;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="overlay">

<div id="loginBox" class="card">
<h2>Login</h2>
<input id="usuario">
<input id="password" type="password">
<button onclick="login()">Entrar</button>
</div>

<div id="mainBox" class="hidden">

<div class="card">
<button class="btn-red" onclick="logout()">Cerrar sesión</button>
</div>

<div class="card">

<h3>Nuevo Aviso</h3>

<label>Máquina</label>
<select id="maquina"></select>

<label>Tipo avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Descripción *</label>
<textarea id="descripcion"></textarea>

<button class="btn-yellow" onclick="crearAviso()">Crear Aviso</button>

</div>

<div class="card">
<h3>Avisos pendientes</h3>
<div id="lista"></div>
</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxBBEkO8vTGZwTLiqza1edNp1V47noX7sA0as90LnczfwLQVl5EUa6yOpvg0_tUFIvO/exec";

let USER=null;
let LISTAS={};

async function login(){

const r=await fetch(API+"?action=login&usuario="+usuario.value+"&password="+password.value);
const d=await r.json();

if(!d.ok)return alert(d.error);

USER=d;
localStorage.setItem("u",JSON.stringify(d));

loginBox.classList.add("hidden");
mainBox.classList.remove("hidden");

await loadListas();
loadAvisos();

}

async function loadListas(){

const r=await fetch(API+"?action=getListas");
const d=await r.json();

LISTAS=d.listas||{};

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO");

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* SOLO PENDIENTES + INFO COMPLETA */
async function loadAvisos(){

const r=await fetch(API+"?action=getAvisos");
const d=await r.json();

lista.innerHTML="";

(d.avisos||[])
.filter(a=>a.estado==="Pendiente")
.forEach(a=>{

let div=document.createElement("div");
div.className="aviso";

div.innerHTML=`
<b>${a.maquina}</b> - ${a.proyecto}<br>
${a.tipoAveria}<br>
${a.descripcion}<br><br>

Usuario: ${a.usuario}<br>
Fecha: ${a.fecha}<br><br>

<button class="btn-orange" onclick="convertir('${a.avisoID}')">OT</button>
<button class="btn-red" onclick="rechazar('${a.avisoID}')">Eliminar</button>
`;

lista.appendChild(div);

});

}

/* VALIDACIÓN */
async function crearAviso(){

if(!descripcion.value.trim()){
return alert("Descripción obligatoria");
}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearAviso",
usuario:USER.usuario,
MAQUINA:maquina.value,
TIPO_AVERIA:tipoAveria.value,
PROYECTO:proyecto.value,
descripcion:descripcion.value
})
});

descripcion.value="";
loadAvisos();

}

function rechazar(id){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario
})
});

document.getElementById(id)?.remove();

}

function convertir(id){
location.href="ot.html?aviso="+id;
}

function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
