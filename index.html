<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión Avisos</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,.55);
min-height:100vh;
padding:10px;
}

.card{
background:rgba(0,0,0,.82);
padding:14px;
border-radius:12px;
margin-bottom:12px;
color:#fff;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
max-width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
cursor:pointer;
}

.btn-yellow{background:#fbc02d;}
.btn-red{background:#d32f2f;color:#fff;}
.btn-blue{background:#1976d2;color:#fff;}
.btn-orange{background:#f57c00;color:#000;}

.aviso{
background:#222;
padding:12px;
margin-top:10px;
border-radius:10px;
overflow-wrap:break-word;
}

.rowBtns{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.rowBtns button{
flex:1;
min-width:120px;
}

.hidden{
display:none;
}

#msgAviso{
margin-top:10px;
color:#00ff90;
font-weight:bold;
}
</style>
</head>

<body>

<div class="overlay">

<!-- LOGIN -->
<div id="loginBox" class="card">

<h2>Login</h2>

<label>Usuario</label>
<input id="usuario">

<label>Contraseña</label>
<input id="password" type="password">

<button onclick="login()">Entrar</button>

</div>

<!-- MAIN -->
<div id="mainBox" class="hidden">

<div class="card">
<button class="btn-red" onclick="logout()">Cerrar sesión</button>
</div>

<!-- NUEVO AVISO -->
<div class="card">

<h3>Nuevo Aviso</h3>

<label>Máquina</label>
<select id="maquina"></select>

<label>Tipo avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Descripción *</label>
<textarea id="descripcion"></textarea>

<button class="btn-yellow" onclick="crearAviso()">Crear Aviso</button>

<p id="msgAviso"></p>

</div>

<!-- GENERAR OT -->
<div id="otBox" class="card hidden">
<button class="btn-blue" onclick="crearOT()">Generar OT</button>
</div>

<!-- AVISOS -->
<div class="card">

<h3>Avisos pendientes</h3>

<div id="listaAvisos"></div>

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxBBEkO8vTGZwTLiqza1edNp1V47noX7sA0as90LnczfwLQVl5EUa6yOpvg0_tUFIvO/exec";

let USER=null;
let LISTAS={};

/* =========================
   LOGIN
========================= */
async function login(){

const r=await fetch(
API+"?action=login&usuario="+encodeURIComponent(usuario.value)+"&password="+encodeURIComponent(password.value)
);

const d=await r.json();

if(!d.ok){
alert(d.error);
return;
}

USER=d;

localStorage.setItem("u",JSON.stringify(USER));

loginBox.classList.add("hidden");
mainBox.classList.remove("hidden");

await loadListas();
loadAvisos();

/* PRODUCCION NO VE OT */
if(USER.rol==="Produccion"){
otBox.classList.add("hidden");
}else{
otBox.classList.remove("hidden");
}

}

/* =========================
   LISTAS
========================= */
async function loadListas(){

const r=await fetch(API+"?action=getListas");
const d=await r.json();

LISTAS=d.listas||{};

fill(maquina,"MAQUINA");
fill(tipoAveria,"AVERIA");
fill(proyecto,"PROYECTO");

}

function fill(select,key){

select.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{

let o=document.createElement("option");
o.value=v;
o.textContent=v;

select.appendChild(o);

});

}

/* =========================
   CREAR AVISO
========================= */
async function crearAviso(){

if(!descripcion.value.trim()){
alert("La descripción es obligatoria");
return;
}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearAviso",
usuario:USER.usuario,
MAQUINA:maquina.value,
TIPO_AVERIA:tipoAveria.value,
PROYECTO:proyecto.value,
descripcion:descripcion.value
})
});

msgAviso.innerText="✔ Aviso creado";

setTimeout(()=>{
msgAviso.innerText="";
},3000);

descripcion.value="";

loadAvisos();

}

/* =========================
   AVISOS
========================= */
async function loadAvisos(){

const r=await fetch(API+"?action=getAvisos");
const d=await r.json();

listaAvisos.innerHTML="";

/* SOLO PENDIENTES + DESCENDENTE */
const avisos=(d.avisos||[])
.filter(a=>a.estado==="Pendiente")
.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

avisos.forEach(a=>{

let div=document.createElement("div");
div.className="aviso";
div.id=a.avisoID;

div.innerHTML=`
<b>Máquina:</b> ${a.maquina}<br>
<b>Proyecto:</b> ${a.proyecto}<br>
<b>Avería:</b> ${a.tipoAveria}<br>
<b>Descripción:</b> ${a.descripcion}<br><br>

<b>Usuario:</b> ${a.usuario}<br>
<b>Fecha:</b> ${new Date(a.fecha).toLocaleString()}<br>
`;

/* PRODUCCION NO VE OT */
if(USER.rol!=="Produccion"){

div.innerHTML+=`
<div class="rowBtns">
<button class="btn-orange" onclick="convertirOT('${a.avisoID}')">
Convertir a OT
</button>

<button class="btn-red" onclick="rechazarAviso('${a.avisoID}')">
Eliminar aviso
</button>
</div>
`;

}

listaAvisos.appendChild(div);

});

}

/* =========================
   RECHAZAR
========================= */
async function rechazarAviso(id){

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario
})
});

document.getElementById(id)?.remove();

}

/* =========================
   OT
========================= */
function crearOT(){
location.href="ot.html";
}

function convertirOT(id){
location.href="ot.html?aviso="+id;
}

/* =========================
   LOGOUT
========================= */
function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
