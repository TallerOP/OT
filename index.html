<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Avisos OP Mobility Pedrola</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
}

.header{
  background:#2d89ef;
  color:white;
  padding:12px;
  font-size:18px;
}

.container{
  max-width:1000px;
  margin:15px auto;
  background:white;
  padding:15px;
  border-radius:10px;
}

input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  box-sizing:border-box;
}

button{
  background:#2d89ef;
  color:white;
  border:none;
  border-radius:6px;
}

button:hover{
  background:#1b5fa7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

.hidden{ display:none; }

.smallbtn{
  width:auto;
  padding:5px 10px;
  margin-right:5px;
}

.green{ background:#5cb85c; }
.red{ background:#d9534f; }

/* DEBUG */
#debugBox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-height:200px;
  overflow:auto;
  background:#000;
  color:#00ff00;
  font-size:12px;
  padding:8px;
  display:none;
  z-index:99999;
}
</style>
</head>

<body>

<!-- DEBUG -->
<div id="debugBox"></div>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="header">Bienvenido al sistema de gestión de avisos</div>

  <h3>Login</h3>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="header">
  Gestión de Avisos OP Mobility Pedrola
</div>

<div class="container">

<h3>Generar Aviso / OT</h3>

<!-- DESPLEGABLES -->
<select id="maquina"></select>
<select id="proyecto"></select>
<select id="tipo"></select>

<input id="desc" placeholder="Descripción">

<button onclick="crearAviso()">Generar Aviso</button>

<button id="btnOT" onclick="crearOT()">Generar OT</button>

</div>

<div class="container">
<h3>Avisos pendientes</h3>
<div id="avisos"></div>
</div>

<div class="container" id="otPanel">
<h3>OTs pendientes exportación</h3>
<div id="ots"></div>
</div>

</div>

<script>

const BASE_URL = "https://script.google.com/macros/s/AKfycbzc4rVg7WTutyAM4BzSQXhur-jv7NhEW84_AfLL_b-rlTP97TgKLSGjZAQmeDDct-Zq/exec";

let currentUser = null;
let role = null;

// ================= DEBUG =================
function logDebug(msg){
  const box = document.getElementById("debugBox");
  box.style.display = "block";
  box.innerHTML += "<div>> " + msg + "</div>";
}

// ================= LOGIN =================
function login(){

  logDebug("LOGIN CLICK");

  const u = user.value;
  const p = pass.value;

  fetch(`${BASE_URL}?action=login&user=${u}&pass=${p}`)
  .then(r=>r.text())
  .then(t=>{

    logDebug("RESP: " + t);

    const parts = t.split("|");

    if(parts[0] === "OK"){

      currentUser = u;
      role = parts[2];

      loginBox.classList.add("hidden");
      app.classList.remove("hidden");

      applyRoles();
      loadData();
      loadLists();

    } else {
      alert("Login incorrecto");
    }

  });

}

// ================= ROLES =================
function applyRoles(){

  if(role === "Produccion"){
    btnOT.style.display = "none";
    otPanel.style.display = "none";
  }

}

// ================= LISTAS =================
function loadLists(){

  logDebug("Cargando listas...");

  fetch(BASE_URL+"?action=getListas")
  .then(r=>r.text())
  .then(t=>{

    const rows = t.split("\n");

    maquina.innerHTML = "";
    proyecto.innerHTML = "";
    tipo.innerHTML = "";

    rows.forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      if(f[0] === "MAQUINA") maquina.innerHTML += `<option>${f[1]}</option>`;
      if(f[0] === "PROYECTO") proyecto.innerHTML += `<option>${f[1]}</option>`;
      if(f[0] === "AVERIA") tipo.innerHTML += `<option>${f[1]}</option>`;

    });

    logDebug("Listas cargadas");

  });

}

// ================= AVISO =================
function crearAviso(){

  logDebug("Crear aviso");

  fetch(BASE_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"crearAviso",
      usuario:currentUser,
      maquina:maquina.value,
      proyecto:proyecto.value,
      tipo:tipo.value,
      descripcion:desc.value
    })
  })
  .then(r=>r.text())
  .then(t=>{
    logDebug("Aviso: " + t);
    loadData();
  });

}

// ================= OT =================
function crearOT(){

  logDebug("Crear OT");

  fetch(BASE_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"crearOT",
      maquina:maquina.value,
      proyecto:proyecto.value,
      descripcion:desc.value
    })
  })
  .then(r=>r.text())
  .then(t=>{
    logDebug("OT: " + t);
    loadData();
  });

}

// ================= LOAD =================
function loadData(){
  loadAvisos();
  loadOTs();
}

// ================= AVISOS =================
function loadAvisos(){

  fetch(BASE_URL+"?action=getAvisos")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("avisos");
    div.innerHTML = "";

    t.split("\n").forEach((r,i)=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        <b>${f[3]}</b> - ${f[5]}<br>
        Usuario: ${f[2]} | Fecha: ${f[1]}<br><br>

        ${role !== "Produccion" ? `
        <button class="smallbtn green" onclick="convertirAviso(${i+2})">Convertir OT</button>
        ` : ""}

        <button class="smallbtn red" onclick="eliminarAviso(${i+2})">Eliminar</button>
      </div>`;
    });

  });

}

// ================= OTs =================
function loadOTs(){

  fetch(BASE_URL+"?action=getOTs")
  .then(r=>r.text())
  .then(t=>{

    const div = document.getElementById("ots");
    div.innerHTML = "";

    t.split("\n").forEach(r=>{

      if(!r) return;

      const f = r.split("|");

      div.innerHTML += `
      <div class="card">
        OT: ${f[0]} | ${f[4]} | ${f[11]}
      </div>`;
    });

  });

}

// ================= ACTIONS =================
function convertirAviso(r){
  fetch(BASE_URL+"?action=convertirAviso&row="+r+"&usuario="+currentUser)
  .then(()=>loadData());
}

function eliminarAviso(r){
  fetch(BASE_URL+"?action=rechazarAviso&row="+r+"&usuario="+currentUser)
  .then(()=>loadData());
}

</script>

</body>
</html>
