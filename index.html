<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Avisos</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.5);
min-height:100vh;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.75);
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:5px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{min-height:100px;}

button{cursor:pointer;font-weight:bold;}

.btn-red{background:red;color:white;}
.btn-orange{background:orange;color:black;}
.btn-yellow{background:gold;color:black;}

.aviso{
background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div id="loginBox" class="card">

<h2>Login</h2>

<label>Usuario</label>
<input id="usuario">

<label>Contraseña</label>
<input id="password" type="password">

<button onclick="login()">Entrar</button>

</div>

<div id="mainBox" class="hidden">

<div class="card">
<button class="btn-red" onclick="logout()">Cerrar sesión</button>
</div>

<div class="card">

<h3>Nuevo Aviso</h3>

<label>Máquina</label>
<select id="maquina"></select>

<label>Tipo avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Descripción *</label>
<textarea id="descripcion"></textarea>

<button class="btn-yellow" onclick="crearAviso()">Crear Aviso</button>

</div>

<div id="otBox" class="card hidden">

<button class="btn-orange" onclick="crearOTDirecta()">Crear OT</button>

</div>

<div id="avisosBox" class="card hidden">

<h3>Avisos pendientes</h3>
<div id="listaAvisos"></div>

</div>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USER=null;
let LISTAS={};

async function login(){

const u=usuario.value;
const p=password.value;

const r=await fetch(`${API}?action=login&usuario=${u}&password=${p}`);
const d=await r.json();

if(!d.ok)return alert(d.error);

USER=d;
localStorage.setItem("u",JSON.stringify(d));

loginBox.classList.add("hidden");
mainBox.classList.remove("hidden");

loadListas();

if(USER.rol!="Operario"){
otBox.classList.remove("hidden");
avisosBox.classList.remove("hidden");
loadAvisos();
}

}

async function loadListas(){

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas;

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO");

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* VALIDACIÓN */
function crearAviso(){

if(!descripcion.value.trim()){
alert("Descripción obligatoria");
return;
}

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearAviso",
usuario:USER.usuario,
maquina:maquina.value,
proyecto:proyecto.value,
tipoAveria:tipoAveria.value,
descripcion:descripcion.value
})
}).then(()=>{

alert("Aviso creado");
descripcion.value="";

});

}

function eliminarAviso(id){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"rechazarAviso",
avisoID:id,
usuario:USER.usuario
})
}).then(()=>{

document.getElementById(id)?.remove();

});

}

async function loadAvisos(){

const r=await fetch(`${API}?action=getAvisos`);
const d=await r.json();

listaAvisos.innerHTML="";

d.avisos.forEach(a=>{

let div=document.createElement("div");
div.className="aviso";
div.id=a.avisoID;

div.innerHTML=`
<b>${a.maquina}</b><br>
${a.tipoAveria}<br>
${a.descripcion}<br><br>

<button class="btn-orange" onclick="convertir('${a.avisoID}')">Convertir OT</button>
<button class="btn-red" onclick="eliminarAviso('${a.avisoID}')">Eliminar</button>
`;

listaAvisos.appendChild(div);

});

}

function convertir(id){
location.href=`ot.html?aviso=${id}`;
}

function crearOTDirecta(){
location.href="ot.html";
}

function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
