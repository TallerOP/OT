<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.78);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

.btn-red{background:#d32f2f;color:white;}
.btn-orange{background:#f57c00;color:black;}

.hidden{display:none;}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Máquina</label>
<select id="maquina"></select>

<label>Avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

</div>

<div class="card">

<h3>Operario 1</h3>
<select id="op1"></select>
<input id="t1" type="number" placeholder="Tiempo">

<button onclick="addOperario()">Añadir operario</button>
<div id="opsExtra"></div>

</div>

<div class="card">

<h3>Material 1</h3>
<input id="m1" placeholder="Material 1">
<input id="q1" type="number" placeholder="Cantidad 1">

<button onclick="window.open('https://tallerop.github.io/gestionrecambios/')">
Escanear material
</button>

<div id="matExtra"></div>

<button onclick="addMaterial()">Añadir material</button>

</div>

<div class="card">

<label>Descripción cierre *</label>
<textarea id="desc"></textarea>

<button class="btn-orange" onclick="guardarOT()">Guardar OT</button>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USERS=[];

async function init(){

const user=JSON.parse(localStorage.getItem("u")||"{}");

if(!user.usuario){
location.href="index.html";
return;
}

if(user.rol==="Produccion"){
location.href="index.html";
return;
}

/* 🔥 CARGA USUARIOS REAL */
const r=await fetch(`${API}?action=getUsuarios`);
const data=await r.json();

/* FILTRO REAL: elimina filas vacías */
USERS=(data.usuarios||[])
.filter(u=>u.emisor && u.emisor.trim()!=="");

/* DEBUG opcional
console.log("USUARIOS CARGADOS:", USERS);
*/

loadEmisores(user.emisor);
loadOperario1(user.emisor);

addOperario();
addMaterial();

}

/* 🔥 EMISOR OT (dropdown + autoselect) */
function loadEmisores(defaultVal){

emisorOT.innerHTML="";

USERS.forEach(u=>{
let opt=document.createElement("option");
opt.value=u.emisor;
opt.textContent=u.emisor;

if(u.emisor===defaultVal){
opt.selected=true;
}

emisorOT.appendChild(opt);
});

}

/* 🔥 OPERARIO 1 SIEMPRE FUNCIONAL */
function loadOperario1(defaultVal){

op1.innerHTML="";

USERS.forEach(u=>{
let opt=document.createElement("option");
opt.value=u.emisor;
opt.textContent=u.emisor;

if(u.emisor===defaultVal){
opt.selected=true;
}

op1.appendChild(opt);
});

}

/* OPERARIOS EXTRA */
function addOperario(){

let div=document.createElement("div");

let sel=document.createElement("select");

USERS.forEach(u=>{
let opt=document.createElement("option");
opt.value=u.emisor;
opt.textContent=u.emisor;
sel.appendChild(opt);
});

let t=document.createElement("input");
t.type="number";
t.placeholder="Tiempo";

div.appendChild(sel);
div.appendChild(t);

opsExtra.appendChild(div);

}

/* MATERIALES */
function addMaterial(){

let div=document.createElement("div");

div.innerHTML=`
<hr>
<input placeholder="Material">
<input type="number" placeholder="Cantidad">
`;

matExtra.appendChild(div);

}

/* GUARDADO OT (estructura estable para Apps Script) */
async function guardarOT(){

if(!desc.value.trim()){
alert("Descripción obligatoria");
return;
}

const payload={
action:"crearOT",
emisorOT:emisorOT.value,
hora:hora.value,
maquina:maquina.value,
tipoAveria:tipoAveria.value,
proyecto:proyecto.value,
estado:estado.value,
operario1:op1.value,
tiempo1:t1.value,
material1:m1.value,
cantidad1:q1.value,
descripcion:desc.value
};

await fetch(API,{
method:"POST",
body:JSON.stringify(payload)
});

alert("OT guardada correctamente");

location.href="index.html";

}

function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
