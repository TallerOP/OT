<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.5);
min-height:100vh;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.75);
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:5px;
border:none;
border-radius:8px;
font-size:16px;
}

.hidden{display:none;}

.btn-red{background:red;color:white;}
.btn-orange{background:orange;color:black;}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<label>Hora</label>
<input id="hora" type="time">

<label>Máquina</label>
<select id="maquina"></select>

<label>Tipo avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

<label>Emisor</label>
<input id="emisor" readonly>

</div>

<div class="card">

<h3>Operarios</h3>
<div id="operarios"></div>

<button onclick="addOperario()">Añadir operario</button>

</div>

<div class="card">

<h3>Materiales</h3>
<div id="materiales"></div>

<button onclick="addMaterial()">Añadir material</button>

</div>

<div class="card">

<label>Descripción cierre *</label>
<textarea id="descCerrar"></textarea>

<label>Planificar</label>
<select id="planificar" onchange="planToggle()">
<option>NO</option>
<option>SI</option>
</select>

<label id="planLabel" class="hidden">Descripción planificación</label>
<textarea id="planAccion" class="hidden"></textarea>

<button class="btn-orange" onclick="guardarOT()">Guardar OT</button>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let LISTAS={};
let usuarios=[];
let op=0;
let mat=0;

async function init(){

const u=JSON.parse(localStorage.getItem("u"));
emisor.value=u.emisor;

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas;

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO");

const ru=await fetch(`${API}?action=login&usuario=&password=`);
usuarios=[];

addOperario(); // OPERARIO 1 SIEMPRE

addMaterial();

const aviso=new URLSearchParams(location.search).get("aviso");

if(aviso){

const r2=await fetch(`${API}?action=getAvisos`);
const d2=await r2.json();

let a=d2.avisos.find(x=>x.avisoID==aviso);

if(a){
maquina.value=a.maquina;
tipoAveria.value=a.tipoAveria;
proyecto.value=a.proyecto;
}

}

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* OPERARIO 1 SIEMPRE VISIBLE */
function addOperario(){

if(op>=6)return;
op++;

let div=document.createElement("div");

let label=document.createElement("label");
label.textContent=`Operario ${op}`;

let select=document.createElement("select");

select.innerHTML=`<option value=""></option>`; // VACÍO

usuarios.forEach(u=>{
let o=document.createElement("option");
o.value=u.emisor;
o.textContent=u.emisor;
select.appendChild(o);
});

let t=document.createElement("input");
t.type="number";
t.placeholder="Tiempo";

div.appendChild(label);
div.appendChild(select);
div.appendChild(t);

operarios.appendChild(div);

}

/* MATERIAL */
function addMaterial(){

if(mat>=4)return;
mat++;

let div=document.createElement("div");

div.innerHTML=`
<label>Material ${mat}</label>
<input>
<label>Cantidad</label>
<input type="number">
<button onclick="window.open('https://tallerop.github.io/gestionrecambios/')">Escanear material</button>
`;

materiales.appendChild(div);

}

/* PLANIFICACIÓN */
function planToggle(){

if(planificar.value=="SI"){
planLabel.classList.remove("hidden");
planAccion.classList.remove("hidden");
}else{
planLabel.classList.add("hidden");
planAccion.classList.add("hidden");
}

}

/* VALIDACIÓN */
async function guardarOT(){

if(!descCerrar.value.trim()){
alert("Descripción cierre obligatoria");
return;
}

const body={
action:"crearOT",
hora:hora.value,
maquina:maquina.value,
tipoAveria:tipoAveria.value,
proyecto:proyecto.value,
estado:estado.value,
emisor:emisor.value,
descripcionCerrar:descCerrar.value,
planificarAccion:planAccion.value
};

const r=await fetch(API,{
method:"POST",
body:JSON.stringify(body)
});

const d=await r.json();

if(d.ok){
alert("OT creada");
location.href="index.html";
}

}

function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
