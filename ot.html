<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.5);
min-height:100vh;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.75);
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:16px;
}

.btn-red{background:red;color:white;}
.btn-orange{background:orange;color:black;}
.btn-yellow{background:gold;color:black;}

.hidden{display:none;}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>OT</h2>

<input id="hora" type="time">

<select id="maquina"></select>
<select id="tipoAveria"></select>

<!-- 🔥 PROYECTO DESPLEGABLE -->
<select id="proyecto"></select>

<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

<input id="emisor" readonly>

</div>

<div class="card">

<h3>Operarios</h3>

<div id="operarios"></div>

<button onclick="addOperario()">Añadir operario</button>

</div>

<div class="card">

<h3>Materiales</h3>

<div id="materiales"></div>

<button onclick="addMaterial()">Añadir material</button>

</div>

<div class="card">

<textarea id="descripcionCerrar" placeholder="Descripción cierre"></textarea>

<select id="planificar">
<option>NO</option>
<option>SI</option>
</select>

<input id="planAccion" placeholder="Planificación" class="hidden">

<button class="btn-orange" onclick="guardar()">Guardar OT</button>

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let LISTAS={};
let usuarios=[];

let op=0;
let mat=0;

async function init(){

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas;

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO"); // 🔥

const u=await fetch(`${API}?action=getUsuarios`);
const ud=await u.json();

usuarios=ud.usuarios;

emisor.value=JSON.parse(localStorage.getItem("u")).emisor;

const aviso=new URLSearchParams(location.search).get("aviso");

if(aviso){

const r=await fetch(`${API}?action=getAvisos`);
const d=await r.json();

let a=d.avisos.find(x=>x.avisoID==aviso);

if(a){
maquina.value=a.maquina;
tipoAveria.value=a.tipoAveria;
proyecto.value=a.proyecto;
}

}

addOperario(); // 🔥 VACÍO POR DEFECTO
addMaterial();

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* 🔥 OPERARIOS DESPLEGABLES VACÍOS */
function addOperario(){

if(op>=6)return;

op++;

let div=document.createElement("div");

let select=document.createElement("select");
select.innerHTML=`<option value=""></option>`; // 🔥 VACÍO POR DEFECTO

usuarios.forEach(u=>{
let o=document.createElement("option");
o.value=u.emisor;
o.textContent=u.emisor;
select.appendChild(o);
});

div.appendChild(select);

let t=document.createElement("input");
t.placeholder="Tiempo";
t.type="number";

div.appendChild(t);

operarios.appendChild(div);

}

/* 🔥 MATERIAL */
function addMaterial(){

if(mat>=4)return;

mat++;

let div=document.createElement("div");

div.innerHTML=`
<input placeholder="Material ${mat}">
<input type="number" placeholder="Cantidad ${mat}">
<button onclick="window.open('https://tallerop.github.io/gestionrecambios/')">Escanear material</button>
`;

materiales.appendChild(div);

}

function guardar(){

alert("OT guardada (conectarlo a Apps Script aquí)");

}

function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
