<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:10px;
}

.card{
background:rgba(0,0,0,0.8);
padding:12px;
border-radius:12px;
margin-bottom:12px;
color:white;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:10px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:15px;
max-width:100%;
}

textarea{min-height:80px;}

.btn-orange{background:#f57c00;color:black;}
.btn-red{background:#d32f2f;color:white;}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.row > *{
flex:1;
min-width:120px;
}
</style>
</head>

<body>

<div class="overlay">

<div class="card">

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Máquina</label>
<select id="maquina"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

<label>Código avería</label>
<input id="codigoAveria">

<label>Tiempo intervención</label>
<input id="tiempoIntervencion" type="number">

</div>

<div class="card">
<h3>Operarios</h3>
<div id="ops"></div>
<button onclick="addOp()">Añadir operario</button>
</div>

<div class="card">
<h3>Materiales</h3>
<div id="mats"></div>
<button onclick="addMat()">Añadir material</button>
</div>

<div class="card">

<label>Descripción crear</label>
<textarea id="descCrear"></textarea>

<label>Descripción cerrar</label>
<textarea id="descCerrar"></textarea>

<label>Planificar</label>
<select id="plan">
<option>NO</option>
<option>SI</option>
</select>

<div id="planBox" class="hidden">
<label>Planificar acción</label>
<textarea id="planAccion"></textarea>
</div>

</div>

<div class="card">
<button class="btn-orange" onclick="guardar()">Guardar OT</button>
</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxBBEkO8vTGZwTLiqza1edNp1V47noX7sA0as90LnczfwLQVl5EUa6yOpvg0_tUFIvO/exec";

let LISTAS={};

async function init(){

const r=await fetch(API+"?action=getListas");
const d=await r.json();

LISTAS=d.listas||{};

fill(emisorOT,"EMISOR OT");
fill(maquina,"MAQUINA");
fill(proyecto,"PROYECTO");

addOp();
addMat();

}

function fill(sel,key){

sel.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
sel.appendChild(o);
});

}

/* OPERARIOS */
function addOp(){

let d=document.createElement("div");
d.className="row";

let s=document.createElement("select");
fill(s,"EMISOR OT");

let t=document.createElement("input");
t.type="number";

d.appendChild(s);
d.appendChild(t);

ops.appendChild(d);

}

/* MATERIALES */
function addMat(){

let d=document.createElement("div");
d.className="row";

d.innerHTML=`
<input placeholder="Material">
<input type="number" placeholder="Cantidad">
`;

mats.appendChild(d);

}

/* GUARDAR OT */
async function guardar(){

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearOT",

EMISOR_OT:emisorOT.value,
HORA:hora.value,
MAQUINA:maquina.value,
PROYECTO:proyecto.value,
ESTADO_OT:estado.value,

CODIGO_AVERIA:codigoAveria.value,
TIEMPO_INTERVENCION:tiempoIntervencion.value,

DESCRIPCION_CREACION:descCrear.value,
DESCRIPCION_CIERRE:descCerrar.value,

PLANIFICAR:plan.value,
PLANIFICAR_ACCION:planAccion.value,

OPERARIOS:[...ops.querySelectorAll("div")].map(d=>({
NOMBRE:d.children[0].value,
TIEMPO:d.children[1].value
})),

MATERIALES:[...mats.querySelectorAll("div")].map(d=>({
MATERIAL:d.children[0].value,
CANTIDAD:d.children[1].value
}))
})
});

alert("OT guardada");
location.href="index.html";

}

init();

</script>

</body>
</html>
