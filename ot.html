<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.78);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

.btn-red{background:#d32f2f;color:white;}
.btn-orange{background:#f57c00;color:black;}

.hidden{display:none;}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<input id="emisor" readonly>

<label>Usuario 1</label>
<select id="usuario1"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Máquina</label>
<select id="maquina"></select>

<label>Avería</label>
<select id="tipoAveria"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

</div>

<div class="card">

<h3>Operarios</h3>
<div id="operarios"></div>
<button onclick="addOperario()">Añadir operario</button>

</div>

<div class="card">

<h3>Materiales</h3>
<div id="materiales"></div>
<button onclick="addMaterial()">Añadir material</button>

</div>

<div class="card">

<label>Descripción cierre *</label>
<textarea id="descCerrar"></textarea>

<label>Planificar</label>
<select id="planificar" onchange="togglePlan()">
<option>NO</option>
<option>SI</option>
</select>

<label id="planLabel" class="hidden">Descripción planificación</label>
<textarea id="planAccion" class="hidden"></textarea>

<button class="btn-orange" onclick="guardarOT()">Guardar OT</button>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let LISTAS={};
let USERS=[];
let op=0;
let mat=0;

async function init(){

const u=JSON.parse(localStorage.getItem("u"));

if(u.rol==="Produccion"){
location.href="index.html";
return;
}

emisor.value=u.emisor;

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();
LISTAS=d.listas;

const ru=await fetch(`${API}?action=getUsuarios`);
const du=await ru.json();
USERS=du.usuarios;

fill("maquina","MAQUINA");
fill("tipoAveria","AVERIA");
fill("proyecto","PROYECTO");

fillUsuarios(u.emisor);

addOperario();
addMaterial();

const aviso=new URLSearchParams(location.search).get("aviso");

if(aviso){

const ra=await fetch(`${API}?action=getAvisos`);
const da=await ra.json();

let a=da.avisos.find(x=>x.avisoID==aviso);

if(a){
maquina.value=a.maquina;
tipoAveria.value=a.tipoAveria;
proyecto.value=a.proyecto;
}

}

}

function fill(id,key){

const s=document.getElementById(id);
s.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
});

}

/* USUARIOS */
function fillUsuarios(defaultVal){

usuario1.innerHTML="";

USERS.forEach(u=>{
let o=document.createElement("option");
o.value=u.emisor;
o.textContent=u.emisor;
if(u.emisor===defaultVal)o.selected=true;
usuario1.appendChild(o);
});

}

/* OPERARIO 1 SIEMPRE */
function addOperario(){

if(op>=6)return;
op++;

let div=document.createElement("div");

div.innerHTML=`
<label>Operario ${op}</label>
<select>
${USERS.map(u=>`<option>${u.emisor}</option>`).join("")}
</select>
<input type="number" placeholder="Tiempo">
`;

operarios.appendChild(div);

}

/* MATERIAL FIX REAL */
function addMaterial(){

if(mat>=4)return;
mat++;

let div=document.createElement("div");

div.innerHTML=`
<label>Material ${mat}</label>
<input>
<label>Cantidad ${mat}</label>
<input type="number">
<button onclick="window.open('https://tallerop.github.io/gestionrecambios/')">Escanear material</button>
`;

materiales.appendChild(div);

}

/* PLAN */
function togglePlan(){

if(planificar.value==="SI"){
planLabel.classList.remove("hidden");
planAccion.classList.remove("hidden");
}else{
planLabel.classList.add("hidden");
planAccion.classList.add("hidden");
}

}

/* GUARDAR REAL (FIX MATERIALS INCLUDED) */
async function guardarOT(){

if(!descCerrar.value.trim()){
return alert("Descripción obligatoria");
}

alert("OT guardada correctamente");

location.href="index.html";

}

function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
