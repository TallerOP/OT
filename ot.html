<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,.55);
min-height:100vh;
padding:10px;
}

.card{
background:rgba(0,0,0,.82);
padding:14px;
border-radius:12px;
margin-bottom:12px;
color:#fff;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
max-width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.row>*{
flex:1;
min-width:120px;
}

textarea{
min-height:90px;
resize:vertical;
}

.hidden{
display:none;
}

.btn-orange{
background:#f57c00;
}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Máquina</label>
<select id="maquina"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Tipo avería</label>
<select id="codigoAveria"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Tiempo intervención</label>
<input id="tiempoInt" type="number">

</div>

<div class="card">

<h3>Operarios</h3>

<div id="ops"></div>

<button onclick="addOp()">
Añadir operario
</button>

</div>

<div class="card">

<h3>Materiales</h3>

<div id="mats"></div>

<button onclick="addMat()">
Añadir material
</button>

</div>

<div class="card">

<label>Descripción crear *</label>
<textarea id="descCrear"></textarea>

<label>Descripción cerrar</label>
<textarea id="descCerrar"></textarea>

<label>Planificar acción</label>
<select id="planificar" onchange="togglePlan()">
<option value="NO">NO</option>
<option value="SI">SI</option>
</select>

<div id="planBox" class="hidden">

<label>Descripción planificación</label>
<textarea id="planAccion"></textarea>

</div>

</div>

<div class="card">

<button class="btn-orange" onclick="guardarOT()">
Guardar OT
</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzr49vNWax5ur6BFBmqo_1qYwM-Xas_7PoR8IbC70wd7vOCtGw_2R2T3QbMIbfS-Vps/exec";

let LISTAS={};

async function init(){

const r=await fetch(API+"?action=getListas");
const d=await r.json();

LISTAS=d.listas||{};

fill(emisorOT,"EMISOR OT");
fill(maquina,"MAQUINA");
fill(proyecto,"PROYECTO");
fill(codigoAveria,"AVERIA");

addOp();
addMat();

await loadAviso();

}

function fill(sel,key){

sel.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{

let o=document.createElement("option");

o.value=v;
o.textContent=v;

sel.appendChild(o);

});

}

async function loadAviso(){

const id=new URLSearchParams(location.search).get("aviso");

if(!id) return;

const r=await fetch(API+"?action=getAvisos");
const d=await r.json();

const a=(d.avisos||[]).find(x=>x.avisoID===id);

if(!a) return;

maquina.value=a.maquina||"";
proyecto.value=a.proyecto||"";
codigoAveria.value=a.tipoAveria||"";
descCrear.value=a.descripcion||"";

}

function addOp(){

if(ops.children.length>=6){
alert("Máximo 6");
return;
}

let div=document.createElement("div");

div.className="row";

div.innerHTML=`
<select class="opSel"></select>
<input class="opTime" type="number" placeholder="Tiempo">
`;

ops.appendChild(div);

fill(div.querySelector(".opSel"),"EMISOR OT");

}

function addMat(){

if(mats.children.length>=4){
alert("Máximo 4");
return;
}

let div=document.createElement("div");

div.className="row";

div.innerHTML=`
<input class="matName" placeholder="Material">
<input class="matQty" type="number" placeholder="Cantidad">
`;

mats.appendChild(div);

}

function togglePlan(){

planBox.classList.toggle(
"hidden",
planificar.value!=="SI"
);

}

async function guardarOT(){

const OPERARIOS=[...ops.querySelectorAll(".row")]
.map(r=>({

NOMBRE:r.querySelector(".opSel").value,
TIEMPO:r.querySelector(".opTime").value

}));

const MATERIALES=[...mats.querySelectorAll(".row")]
.map(r=>({

MATERIAL:r.querySelector(".matName").value,
CANTIDAD:r.querySelector(".matQty").value

}));

await fetch(API,{
method:"POST",
body:JSON.stringify({

action:"crearOT",

EMISOR_OT:emisorOT.value,

MAQUINA:maquina.value,
PROYECTO:proyecto.value,

CODIGO_AVERIA:codigoAveria.value,

HORA:hora.value,
TIEMPO_INTERVENCION:tiempoInt.value,

DESCRIPCION_CREACION:descCrear.value,

/* FIX */
DESCRIPCION_CIERRE:descCerrar.value,

/* FIX */
DESCRIPCION_PLANIFICACION:
planificar.value==="SI"
? planAccion.value
: "",

PLANIFICAR:"SI",

OPERARIOS,
MATERIALES

})
});

alert("OT guardada");

location.href="index.html";

}

init();

</script>

</body>
</html>
