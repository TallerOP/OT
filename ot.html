<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OT</title>

<style>

*{
box-sizing:border-box;
}

:root{
--bg-overlay:rgba(0,0,0,.55);
--card-bg:rgba(0,0,0,.82);
--text:#fff;
--input-bg:#fff;
--input-text:#000;
}

body.light{
--bg-overlay:rgba(255,255,255,.72);
--card-bg:rgba(255,255,255,.92);
--text:#111;
--input-bg:#fff;
--input-text:#000;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:url('op.png') center/cover fixed;
}

.overlay{
background:var(--bg-overlay);
min-height:100vh;
padding:10px;
}

.card{
background:var(--card-bg);
padding:14px;
border-radius:12px;
margin-bottom:12px;
color:var(--text);
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
max-width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
background:var(--input-bg);
color:var(--input-text);
}

textarea{
min-height:90px;
resize:vertical;
}

button{
cursor:pointer;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.row>*{
flex:1;
min-width:120px;
}

.btn-orange{
background:#f57c00;
color:#000;
}

.btn-red{
background:#d32f2f;
color:#fff;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<div class="row">

<button class="btn-red" onclick="logout()">
Cerrar sesión
</button>

<button onclick="toggleTheme()">
Modo oscuro/claro
</button>

</div>

</div>

<div class="card">

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Máquina</label>
<select id="maquina"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Tipo avería</label>
<select id="codigoAveria"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Tiempo intervención</label>
<input id="tiempoInt" type="number">

</div>

<div class="card">

<h3>Operarios</h3>

<div id="ops"></div>

<button onclick="addOp()">
Añadir operario
</button>

</div>

<div class="card">

<h3>Materiales</h3>

<div id="mats"></div>

<button onclick="addMat()">
Añadir material
</button>

</div>

<div class="card">

<label>Descripción crear *</label>
<textarea id="descCrear"></textarea>

<label>Descripción cerrar</label>
<textarea id="descCerrar"></textarea>

<label>Planificar acción</label>
<select id="planificar" onchange="togglePlan()">
<option value="NO">NO</option>
<option value="SI">SI</option>
</select>

<div id="planBox" class="hidden">

<label>Descripción planificación</label>
<textarea id="planAccion"></textarea>

</div>

</div>

<div class="card">

<button class="btn-orange" onclick="guardarOT()">
Guardar OT
</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxBBEkO8vTGZwTLiqza1edNp1V47noX7sA0as90LnczfwLQVl5EUa6yOpvg0_tUFIvO/exec";

let LISTAS={};

/* =========================
   TEMA
========================= */

function toggleTheme(){

document.body.classList.toggle("light");

localStorage.setItem(
"theme",
document.body.classList.contains("light")
? "light"
: "dark"
);

}

(function(){

const t=localStorage.getItem("theme");

if(t==="light"){
document.body.classList.add("light");
}

})();

/* =========================
   INIT
========================= */

async function init(){

const USER=JSON.parse(localStorage.getItem("u")||"{}");

if(!USER.usuario){

location.href="index.html";
return;

}

/* PRODUCCION BLOQUEADO */

if(USER.rol==="Produccion"){

location.href="index.html";
return;

}

const r=await fetch(API+"?action=getListas");

const d=await r.json();

LISTAS=d.listas||{};

fill(emisorOT,"EMISOR OT");
fill(maquina,"MAQUINA");
fill(proyecto,"PROYECTO");
fill(codigoAveria,"AVERIA");

/* EMISOR DEFAULT */

if(USER.emisor){
emisorOT.value=USER.emisor;
}

addOp();
addMat();

/* CARGAR AVISO */

await loadAviso();

}

/* =========================
   FILL
========================= */

function fill(select,key){

select.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{

let o=document.createElement("option");

o.value=v;
o.textContent=v;

select.appendChild(o);

});

}

/* =========================
   CARGAR DATOS AVISO
========================= */

async function loadAviso(){

const params=new URLSearchParams(location.search);

const avisoID=params.get("aviso");

if(!avisoID) return;

const r=await fetch(API+"?action=getAvisos");

const d=await r.json();

const aviso=(d.avisos||[]).find(a=>a.avisoID===avisoID);

if(!aviso) return;

/* CARGAR DATOS */

maquina.value=aviso.maquina || "";
proyecto.value=aviso.proyecto || "";
codigoAveria.value=aviso.tipoAveria || "";
descCrear.value=aviso.descripcion || "";

}

/* =========================
   OPERARIOS
========================= */

function addOp(){

if(ops.children.length>=6){

alert("Máximo 6 operarios");
return;

}

let div=document.createElement("div");

div.className="row";

div.innerHTML=`

<select class="opSel"></select>

<input type="number"
class="opTime"
placeholder="Tiempo">

`;

ops.appendChild(div);

fill(div.querySelector(".opSel"),"EMISOR OT");

}

/* =========================
   MATERIALES
========================= */

function addMat(){

if(mats.children.length>=4){

alert("Máximo 4 materiales");
return;

}

let div=document.createElement("div");

div.className="row";

div.innerHTML=`

<input class="matName"
placeholder="Material">

<input class="matQty"
type="number"
placeholder="Cantidad">

`;

mats.appendChild(div);

}

/* =========================
   PLANIFICACION
========================= */

function togglePlan(){

if(planificar.value==="SI"){

planBox.classList.remove("hidden");

}else{

planBox.classList.add("hidden");

}

}

/* =========================
   GUARDAR OT
========================= */

async function guardarOT(){

if(!descCrear.value.trim()){

alert("La descripción es obligatoria");
return;

}

/* OPERARIOS */

const OPERARIOS=[...document.querySelectorAll("#ops .row")]
.map(r=>({

NOMBRE:r.querySelector(".opSel").value || "",
TIEMPO:r.querySelector(".opTime").value || ""

}));

/* MATERIALES */

const MATERIALES=[...document.querySelectorAll("#mats .row")]
.map(r=>({

MATERIAL:r.querySelector(".matName").value || "",
CANTIDAD:r.querySelector(".matQty").value || ""

}));

/* PAYLOAD EXACTO */

const payload={

action:"crearOT",

/* OT VACIO */
OT:"",

EMISOR_OT:emisorOT.value || "",
MAQUINA:maquina.value || "",
PROYECTO:proyecto.value || "",

/* FIX CODIGO AVERIA */
CODIGO_AVERIA:codigoAveria.value || "",

HORA:hora.value || "",

/* FIX TIEMPO INT */
TIEMPO_INTERVENCION:tiempoInt.value || "",

/* FIX DESCRIPCIONES */
DESCRIPCION_CREACION:descCrear.value || "",
DESCRIPCION_CIERRE:descCerrar.value || "",

/* FIX PLANIFICACION */
PLANIFICAR_ACCION:planificar.value || "NO",

DESCRIPCION_PLANIFICACION:
planificar.value==="SI"
? planAccion.value || ""
: "",

/* ARRAYS */
OPERARIOS,
MATERIALES

};

const r=await fetch(API,{

method:"POST",

body:JSON.stringify(payload)

});

const d=await r.json();

if(!d.ok){

alert(d.error || "Error guardando OT");
return;

}

alert("OT guardada");

location.href="index.html";

}

/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.clear();

location.href="index.html";

}

init();

</script>

</body>
</html>
