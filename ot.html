<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>
body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:10px;
}

.card{
background:rgba(0,0,0,0.8);
padding:12px;
border-radius:12px;
margin-bottom:12px;
color:white;
}

input,select,textarea,button{
width:100%;
padding:10px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:15px;
box-sizing:border-box;
}

textarea{min-height:80px;}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.row > *{
flex:1;
min-width:120px;
}

.btn-orange{background:#f57c00;color:black;}
</style>
</head>

<body>

<div class="overlay">

<div class="card">

<h2>OT</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Máquina</label>
<select id="maquina"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Código avería</label>
<select id="codigoAveria"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Tiempo intervención</label>
<input id="tiempoInt" type="number">

</div>

<div class="card">
<h3>Operarios (máx 6)</h3>
<div id="ops"></div>
<button onclick="addOp()">Añadir operario</button>
</div>

<div class="card">
<h3>Materiales (máx 4)</h3>
<div id="mats"></div>
<button onclick="addMat()">Añadir material</button>
</div>

<div class="card">

<label>Descripción crear</label>
<textarea id="descCrear"></textarea>

<label>Descripción cerrar</label>
<textarea id="descCerrar"></textarea>

<label>Planificar</label>
<select id="plan" onchange="togglePlan()">
<option>NO</option>
<option>SI</option>
</select>

<div id="planBox" class="hidden">
<label>Planificación acción</label>
<textarea id="planAccion"></textarea>
</div>

</div>

<div class="card">
<button class="btn-orange" onclick="guardar()">Guardar OT</button>
</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxG1OoS8qIRTbdDF4QXZdWEV6VxhpFSFW8UGCKX6PLup4Ddyb8Igdc9M4Rz8U5yRduP/exec";

let LISTAS={};

async function init(){

const r=await fetch(API+"?action=getListas");
const d=await r.json();

LISTAS=d.listas||{};

fill(emisorOT,"EMISOR OT");
fill(maquina,"MAQUINA");
fill(proyecto,"PROYECTO");
fill(codigoAveria,"AVERIA");

addOp();
addMat();

}

/* LIMITES */
function addOp(){
if(ops.children.length>=6)return;

let d=document.createElement("div");
d.className="row";

d.innerHTML=`
<select></select>
<input type="number">
`;

fill(d.children[0],"EMISOR OT");

ops.appendChild(d);
}

function addMat(){
if(mats.children.length>=4)return;

let d=document.createElement("div");
d.className="row";

d.innerHTML=`
<input placeholder="Material">
<input type="number">
`;

mats.appendChild(d);
}

/* FILL */
function fill(sel,key){

sel.innerHTML="";

(LISTAS[key]||[]).forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
sel.appendChild(o);
});

}

/* PLANIFICACION */
function togglePlan(){
planBox.style.display=(plan.value==="SI")?"block":"none";
}

/* GUARDAR OT */
async function guardar(){

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearOT",

EMISOR_OT:emisorOT.value,
MAQUINA:maquina.value,
PROYECTO:proyecto.value,
CODIGO_AVERIA:codigoAveria.value,

HORA:hora.value,
TIEMPO_INTERVENCION:tiempoInt.value,

DESCRIPCION_CREACION:descCrear.value,
DESCRIPCION_CIERRE:descCerrar.value,

PLANIFICAR:plan.value,
PLANIFICAR_ACCION:planAccion.value,

OPERARIOS:[...ops.querySelectorAll(".row")].map(r=>({
NOMBRE:r.children[0].value,
TIEMPO:r.children[1].value
})),

MATERIALES:[...mats.querySelectorAll(".row")].map(r=>({
MATERIAL:r.children[0].value,
CANTIDAD:r.children[1].value
}))
})
});

alert("OT guardada");
location.href="index.html";

}

init();

</script>

</body>
</html>
