<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.80);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{min-height:90px;}

.btn-red{background:#d32f2f;color:white;}
.btn-orange{background:#f57c00;color:black;}
.btn-blue{background:#1976d2;color:white;}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Máquina</label>
<select id="maquina"></select>

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

</div>

<div class="card">

<h3>Operarios</h3>

<div id="operarios"></div>

<button onclick="addOperario()">Añadir operario</button>

</div>

<div class="card">

<h3>Materiales</h3>

<div id="materiales"></div>

<button onclick="addMaterial()">Añadir material</button>

</div>

<div class="card">

<label>Descripción cierre *</label>
<textarea id="descripcion"></textarea>

</div>

<div class="card">

<button class="btn-orange" onclick="guardarOT()">Guardar OT</button>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let LISTAS={};

async function init(){

const user=JSON.parse(localStorage.getItem("u")||"{}");

if(!user.usuario){
location.href="index.html";
return;
}

const r=await fetch(`${API}?action=getListas`);
const d=await r.json();

LISTAS=d.listas||{};

/* FIX robusto */
const get=(tipo)=>
(LISTAS[tipo]||[])
.filter(v=>v && v.trim()!=="")

/* 🔥 EMISOR OT (LISTAS) */
fillSelect(emisorOT,get("EMISOR OT"));

/* 🔥 MAQUINA */
fillSelect(maquina,get("MAQUINA"));

/* 🔥 PROYECTO */
fillSelect(proyecto,get("PROYECTO"));

/* OPERARIOS INICIALES */
addOperario();
addOperario();

}

function fillSelect(select,arr){

select.innerHTML="";

arr.forEach(v=>{
let o=document.createElement("option");
o.value=v;
o.textContent=v;
select.appendChild(o);
});

}

/* OPERARIOS (EMISOR OT SOURCE) */
function addOperario(){

const div=document.createElement("div");

const sel=document.createElement("select");

fillSelect(sel,(LISTAS["EMISOR OT"]||[]));

const t=document.createElement("input");
t.type="number";
t.placeholder="Tiempo";

div.appendChild(sel);
div.appendChild(t);

operarios.appendChild(div);

}

/* MATERIALES */
function addMaterial(){

const div=document.createElement("div");

div.innerHTML=`
<input placeholder="Material">
<input type="number" placeholder="Cantidad">
`;

materiales.appendChild(div);

}

/* GUARDAR */
async function guardarOT(){

if(!descripcion.value.trim()){
return alert("Descripción obligatoria");
}

await fetch(API,{
method:"POST",
body:JSON.stringify({
action:"crearOT",
emisorOT:emisorOT.value,
hora:hora.value,
maquina:maquina.value,
proyecto:proyecto.value,
estado:estado.value,
descripcion:descripcion.value
})
});

alert("OT guardada correctamente");
location.href="index.html";

}

function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
