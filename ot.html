<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:url('op.png') center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
color:white;
}

.card{
background:rgba(0,0,0,0.80);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{min-height:100px;}

.btn-red{background:#d32f2f;color:white;}
.btn-orange{background:#f57c00;color:black;}
.btn-blue{background:#1976d2;color:white;}

.hidden{display:none;}

.smallbtn{
margin-top:5px;
background:#444;
color:white;
}

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<!-- HEADER -->
<div class="card">

<button class="btn-red" onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<label>Emisor OT</label>
<select id="emisorOT"></select>

<label>Hora</label>
<input id="hora" type="time">

<label>Proyecto</label>
<select id="proyecto"></select>

<label>Estado</label>
<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

</div>

<!-- OPERARIOS -->
<div class="card">

<h3>Operarios</h3>

<div id="operarios"></div>

<button class="smallbtn" onclick="addOperario()">Añadir operario</button>

</div>

<!-- MATERIALES -->
<div class="card">

<h3>Materiales</h3>

<div id="materiales"></div>

<button class="smallbtn" onclick="addMaterial()">Añadir material</button>

<button class="btn-blue" onclick="scanMaterial()">Escanear material</button>

</div>

<!-- DESCRIPCIÓN -->
<div class="card">

<label>Descripción cerrar *</label>
<textarea id="descripcion"></textarea>

<label>Planificar</label>
<select id="planificar" onchange="togglePlan()">
<option value="NO">NO</option>
<option value="SI">SI</option>
</select>

<div id="planBox" class="hidden">
<label>Planificar acción</label>
<textarea id="planAccion"></textarea>
</div>

</div>

<!-- GUARDAR -->
<div class="card">

<button class="btn-orange" onclick="guardarOT()">Guardar OT</button>

</div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USERS=[];
let LISTAS={};

let opCount=1;
let matCount=1;

/* INIT */
async function init(){

const user=JSON.parse(localStorage.getItem("u")||"{}");

if(!user.usuario){
location.href="index.html";
return;
}

const r1=await fetch(`${API}?action=getUsuarios`);
const d1=await r1.json();

USERS=(d1.usuarios||[])
.filter(u=>u.emisor && u.emisor.trim()!="");

const r2=await fetch(`${API}?action=getListas`);
const d2=await r2.json();

LISTAS=d2.listas||{};

loadEmisores(user.emisor);
loadProyecto();

addOperario();   // Operario 1 fijo
addMaterial();   // Material 1 fijo

}

/* EMISOR OT */
function loadEmisores(defaultVal){

emisorOT.innerHTML="";

USERS.forEach(u=>{
let o=document.createElement("option");
o.value=u.emisor;
o.textContent=u.emisor;

if(u.emisor===defaultVal){
o.selected=true;
}

emisorOT.appendChild(o);
});

}

/* PROYECTO */
function loadProyecto(){

proyecto.innerHTML="";

(LISTAS.PROYECTO||[]).forEach(p=>{
let o=document.createElement("option");
o.value=p;
o.textContent=p;
proyecto.appendChild(o);
});

}

/* OPERARIOS (1-6) */
function addOperario(){

if(opCount>6)return;

let div=document.createElement("div");

let label=document.createElement("label");
label.textContent=`Operario ${opCount}`;

let sel=document.createElement("select");

USERS.forEach(u=>{
let o=document.createElement("option");
o.value=u.emisor;
o.textContent=u.emisor;
sel.appendChild(o);
});

let t=document.createElement("input");
t.type="number";
t.placeholder="Tiempo";

div.appendChild(label);
div.appendChild(sel);
div.appendChild(t);

operarios.appendChild(div);

opCount++;

}

/* MATERIALES (1-4) */
function addMaterial(){

if(matCount>4)return;

let div=document.createElement("div");

div.innerHTML=`
<label>Material ${matCount}</label>
<input class="mat">
<label>Cantidad ${matCount}</label>
<input class="qty" type="number">
`;

materiales.appendChild(div);

matCount++;

}

/* ESCANER */
function scanMaterial(){

window.open("https://tallerop.github.io/gestionrecambios/","_blank");

}

/* PLANIFICACIÓN */
function togglePlan(){

planBox.classList.toggle("hidden", planificar.value==="NO");

}

/* GUARDAR OT REAL */
async function guardarOT(){

if(!descripcion.value.trim()){
return alert("Descripción obligatoria");
}

/* OPERARIOS */
let ops=[...operarios.querySelectorAll("select")].map(s=>s.value);
let times=[...operarios.querySelectorAll("input")].map(i=>i.value);

/* MATERIALES */
let mats=[...materiales.querySelectorAll(".mat")].map(i=>i.value);
let qtys=[...materiales.querySelectorAll(".qty")].map(i=>i.value);

const user=JSON.parse(localStorage.getItem("u"));

const payload={
action:"crearOT",

emisorOT:emisorOT.value,
hora:hora.value,
proyecto:proyecto.value,
estado:estado.value,

descripcion:descripcion.value,
planificar:planificar.value,
planAccion:planAccion.value || "",

operarios:ops,
tiempos:times,

materiales:mats,
cantidades:qtys,

usuario:user.usuario
};

const r=await fetch(API,{
method:"POST",
body:JSON.stringify(payload)
});

const d=await r.json();

if(d.ok){
alert("OT guardada correctamente");
location.href="index.html";
}else{
alert("Error al guardar OT");
}

}

/* LOGOUT */
function logout(){
localStorage.clear();
location.href="index.html";
}

init();

</script>

</body>
</html>
