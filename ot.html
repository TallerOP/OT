<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OT</title>

<style>

body{
font-family:Arial;
margin:0;
padding:0;
background:url('op.png');
background-size:cover;
background-position:center;
color:white;
}

.container{
background:rgba(0,0,0,0.8);
margin:10px;
padding:20px;
border-radius:10px;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-size:16px;
box-sizing:border-box;
}

button{
background:#1976d2;
color:white;
font-weight:bold;
}

.hidden{
display:none;
}

</style>

</head>
<body>

<div class="container">

<button onclick="logout()">Cerrar sesión</button>

<h2>Orden de Trabajo</h2>

<input id="hora" type="time">

<select id="maquina"></select>

<select id="tipoAveria"></select>

<input id="proyecto">

<select id="estado">
<option>ABIERTA</option>
<option>CERRADA</option>
</select>

<input id="emisor" readonly>

<div id="operarios"></div>

<button onclick="addOperario()">Añadir operario</button>

<div id="materiales"></div>

<button onclick="addMaterial()">Añadir material</button>

<textarea id="descripcionCrear" placeholder="Descripción crear"></textarea>

<textarea id="descripcionCerrar" placeholder="Descripción cerrar"></textarea>

<select id="planificar" onchange="togglePlanificar()">
<option value="NO">NO</option>
<option value="SI">SI</option>
</select>

<input id="planificarAccion" class="hidden" placeholder="Planificar acción">

<button onclick="guardarOT()">Guardar OT</button>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxCLha_hKJ9I76bZeyoMQScn7C4aKR0BtLu7s8YIxGPEjiz4vBBlUBEFN7PuY6fhmIU/exec";

let USER=JSON.parse(localStorage.getItem("user"));

let LISTAS={};

let operarios=1;
let materiales=1;

function logout(){

localStorage.clear();
location.href="index.html";

}

async function init(){

document.getElementById("emisor").value=USER.emisor;

const r=await fetch(`${API}?action=getListas`);

const d=await r.json();

LISTAS=d.listas;

cargarSelect("maquina","MAQUINA");
cargarSelect("tipoAveria","AVERIA");
cargarSelect("proyecto","PROYECTO");

addOperario();
addMaterial();

const params=new URLSearchParams(location.search);

const ot=params.get("ot");

if(ot){

const rr=await fetch(`${API}?action=getOT&ot=${ot}`);

const dd=await rr.json();

if(dd.ok){

const row=dd.data;

maquina.value=row[11];
proyecto.value=row[12];
tipoAveria.value=row[19];
descripcionCrear.value=row[26];

}

}

}

function cargarSelect(id,tipo){

const s=document.getElementById(id);

s.innerHTML="";

LISTAS[tipo].forEach(v=>{

const o=document.createElement("option");

o.value=v;
o.textContent=v;

s.appendChild(o);

});

}

function addOperario(){

if(operarios>6)return;

const div=document.createElement("div");

div.innerHTML=`

<input id="operario${operarios}" placeholder="Operario ${operarios}">
<input id="tiempo${operarios}" type="number" placeholder="Tiempo ${operarios}">

`;

document.getElementById("operarios").appendChild(div);

operarios++;

}

function addMaterial(){

if(materiales>4)return;

const div=document.createElement("div");

div.innerHTML=`

<input id="material${materiales}" placeholder="Material ${materiales}">
<input id="qtt${materiales}" type="number" placeholder="Cantidad ${materiales}">

<button onclick="abrirRecambios(${materiales})">Escanear material</button>

`;

document.getElementById("materiales").appendChild(div);

materiales++;

}

function abrirRecambios(n){

window.open("https://TUWEBRECAMBIOS.com");

window.materialActual=n;

}

window.addEventListener("message",(e)=>{

const data=e.data;

document.getElementById(`material${window.materialActual}`).value=data.material;

document.getElementById(`qtt${window.materialActual}`).value=data.cantidad;

});

function togglePlanificar(){

if(planificar.value=="SI"){

planificarAccion.classList.remove("hidden");

}else{

planificarAccion.classList.add("hidden");

}

}

async function guardarOT(){

const body={

action:"crearOT",

hora:hora.value,
maquina:maquina.value,
tipoAveria:tipoAveria.value,
proyecto:proyecto.value,
estado:estado.value,
emisor:emisor.value,

descripcionCrear:descripcionCrear.value,
descripcionCerrar:descripcionCerrar.value,

planificarAccion:planificarAccion.value

};

for(let i=1;i<=6;i++){

body[`operario${i}`]=document.getElementById(`operario${i}`)?.value || "";
body[`tiempo${i}`]=document.getElementById(`tiempo${i}`)?.value || "";

}

for(let i=1;i<=4;i++){

body[`material${i}`]=document.getElementById(`material${i}`)?.value || "";
body[`qtt${i}`]=document.getElementById(`qtt${i}`)?.value || "";

}

const r=await fetch(API,{
method:"POST",
body:JSON.stringify(body)
});

const d=await r.json();

if(d.ok){

alert("OT guardada");

location.href="index.html";

}

}

init();

</script>

</body>
</html>
